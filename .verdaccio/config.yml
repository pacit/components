# path to a directory with all packages
storage: ../tmp/local-registry/storage

# a list of other known repositories we can talk to
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    maxage: 60m

packages:
  # The package under test is LOCAL ONLY: no uplink for its scope. With the proxy below, npm's
  # own pre-publish check found `0.1.0` on the public registry the hour it was published there
  # and refused the local publish — two runs red for nothing that had changed in the package
  # (lesson-223). A rehearsal registry that answers for the thing being rehearsed with the
  # public registry's answers is not a rehearsal. The peers stay proxied, on purpose.
  '@pacit/*':
    access: $all
    publish: $all
    unpublish: $all

  '**':
    # give all users (including non-authenticated users) full access
    # because it is a local registry
    access: $all
    publish: $all
    unpublish: $all

    # if package is not available locally, proxy requests to npm registry
    proxy: npmjs

# log settings
log:
  type: stdout
  format: pretty
  level: warn

publish:
  allow_offline: true # set offline to true to allow publish offline
