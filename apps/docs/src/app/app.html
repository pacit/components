<div class="site" [pctTheme]="theme()" data-testid="site">
  <header class="topbar">
    <pct-container>
      <div class="topbar__row">
        <a class="wordmark" routerLink="/" aria-label="pacit — home">pacit</a>
        <nav class="topbar__nav" aria-label="Site">
          @for (item of nav; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="is-active">
            {{ item.label }}
          </a>
          }
        </nav>
        <a class="topbar__start" routerLink="/start">Get started</a>
        <button
          pctButton
          variant="ghost"
          size="sm"
          class="topbar__theme"
          (click)="cycleTheme()"
          data-testid="theme-toggle"
        >
          Theme: {{ themeLabel() }}
        </button>
        <button
          pctButton
          variant="ghost"
          size="sm"
          class="topbar__menu"
          [pctDrawerTrigger]="menu"
          data-testid="menu-trigger"
        >
          Menu
        </button>
      </div>
    </pct-container>
  </header>

  <pct-drawer #menu heading="pacit" [(open)]="menuOpen" data-testid="menu">
    <nav class="drawer-nav" aria-label="Site">
      <a routerLink="/start" (click)="menuOpen.set(false)">Get started</a>
      @for (item of nav; track item.path) {
      <a [routerLink]="item.path" (click)="menuOpen.set(false)">
        {{ item.label }}
      </a>
      }
    </nav>
  </pct-drawer>

  <main class="page">
    <router-outlet />
  </main>

  <footer class="footer">
    <pct-container>
      <p class="footer__line">
        Built from <code>&#64;pacit/components</code> — the library this site
        documents. Every number on these pages is measured by the repository's
        own gates.
      </p>
    </pct-container>
  </footer>
</div>
