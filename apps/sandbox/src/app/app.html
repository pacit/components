<header class="shell__head">
  <div class="shell__brand">
    <h1>@pacit/components — sandbox</h1>
    <p>
      One view per component, plus cross-cutting views checking the shared axes:
      size, theme, skin.
    </p>
  </div>

  <sbx-controls
    [(scheme)]="settings.scheme"
    [(skin)]="settings.skin"
    [(size)]="settings.size"
    [(dir)]="settings.dir"
    data-testid="global-controls"
  />
</header>

<!--
  The region key, mounted where an application mounts it. The library installs nothing on the
  document by itself — which key is free is a question only an application can answer (0072)
  — so the sandbox says so here, in one word, and takes F6.
-->
<div class="shell__body" pctRegionKey listenOn="document">
  <nav class="shell__nav" aria-label="Sandbox views" pctRegion>
    @for (group of groups; track group.id) {
    <h2 class="shell__nav-heading">{{ group.label }}</h2>
    <ul class="shell__nav-list">
      @for (view of group.views; track view.path) {
      <li>
        <a
          [routerLink]="'/' + view.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: view.path === '' }"
          [attr.data-testid]="'nav-' + (view.path || 'index')"
        >
          {{ view.title }}
        </a>
      </li>
      }
    </ul>
    }
  </nav>

  <main class="shell__view" pctRegion="Main view">
    <router-outlet />
  </main>
</div>
