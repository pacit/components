<h2 class="view__title">Select</h2>
<p class="muted view__intro">
  The focus stays on the trigger, the active option is pointed at by
  <code>aria-activedescendant</code>. The keyboard: the arrows, Home/End, Enter,
  Escape and typeahead.
</p>

<sbx-demo
  #inField
  heading="Inside the wrapper"
  summary="The size belongs to the wrapper — the control hands its own over, just as it hands over the border."
  [reqs]="['req-api-wrapper', 'req-api-size']"
  data-testid="demo-in-field"
>
  <div class="stack">
    <pct-field
      label="Country"
      hint="A list with a panel of its own (CDK Overlay)"
      [size]="inField.activeSize()"
      data-testid="field-country"
    >
      <pct-select
        [options]="countries"
        [(value)]="country"
        data-testid="select-country"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="Panel width"
  summary="By default the panel is as wide as the visible control — inside a wrapper measured from the field border, not from the trigger within. It can be handed to the content (auto) or given literally; then the alignment decides as well."
  [reqs]="['req-api-wrapper']"
  [controls]="[]"
  data-testid="demo-panel-width"
>
  <div class="stack stack--narrow">
    <pct-field label="field (the default)" data-testid="field-width-field">
      <pct-select
        [options]="languages"
        [(value)]="widthField"
        data-testid="select-width-field"
      />
    </pct-field>

    <pct-field
      label="auto — out to the longest option"
      data-testid="field-width-auto"
    >
      <pct-select
        panelWidth="auto"
        [options]="languages"
        [(value)]="widthAuto"
        data-testid="select-width-auto"
      />
    </pct-field>

    <pct-field
      label="320px, aligned to the end"
      data-testid="field-width-fixed"
    >
      <pct-select
        panelWidth="320px"
        panelAlign="end"
        [options]="languages"
        [(value)]="widthFixed"
        data-testid="select-width-fixed"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="The panel and the scoped theme"
  summary="The panel renders outside the host tree, so the theme cascade does not reach it — the theme of the nearest ancestor is carried onto the panel explicitly."
  [reqs]="['lesson-18', 'req-token-scoped']"
  scheme="dark"
  [controls]="[]"
  data-testid="demo-scoped"
>
  <div class="stack">
    <pct-field label="Country (in the dark theme)" data-testid="field-scoped">
      <pct-select
        [options]="countries"
        [(value)]="scopedCountry"
        data-testid="select-scoped"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="With no wrapper"
  summary="Outside pct-field the select draws a label of its own and polices the touch area itself."
  [reqs]="['req-api-no-wrapper', 'req-a11y-touch']"
  data-testid="demo-standalone"
>
  <pct-select
    label="Country"
    [options]="countries"
    [(value)]="bareCountry"
    data-testid="select-bare"
  />
</sbx-demo>

<sbx-demo
  heading="An empty list"
  summary="The panel says there is nothing to pick. Focus stays on the trigger, so the sentence inside the listbox is text no screen reader is pointed at — the library announces it instead."
  [reqs]="['req-a11y-built-in', 'req-api-texts']"
  [controls]="[]"
  data-testid="demo-empty"
>
  <div class="stack">
    <pct-field label="Country (nothing to pick)" data-testid="field-empty">
      <pct-select
        [options]="none"
        [(value)]="emptyCountry"
        data-testid="select-empty"
      />
    </pct-field>
  </div>
</sbx-demo>
