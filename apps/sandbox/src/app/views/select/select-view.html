<h2 class="view__title">Select</h2>
<p class="muted view__intro">
  Fokus zostaje na triggerze, aktywną opcję wskazuje
  <code>aria-activedescendant</code>. Klawiatura: strzałki, Home/End, Enter,
  Escape i typeahead.
</p>

<sbx-demo
  #wobudowie
  heading="W obudowie"
  summary="Wielkość należy do obudowy — kontrolka oddaje jej swoją, tak jak oddaje ramkę."
  [reqs]="['req-api-wrapper', 'req-api-size']"
  data-testid="demo-in-field"
>
  <div class="stack">
    <pct-field
      label="Kraj"
      hint="Lista z własnym panelem (CDK Overlay)"
      [size]="wobudowie.activeSize()"
      data-testid="field-country"
    >
      <pct-select
        [options]="countries"
        [(value)]="country"
        data-testid="select-country"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="Szerokość panelu"
  summary="Domyślnie panel ma szerokość widocznej kontrolki — w obudowie liczoną od ramki pola, nie od triggera w środku. Można ją oddać treści (auto) albo podać wprost; wtedy decyduje jeszcze wyrównanie."
  [reqs]="['req-api-wrapper']"
  [controls]="[]"
  data-testid="demo-panel-width"
>
  <div class="stack stack--narrow">
    <pct-field label="field (domyślnie)" data-testid="field-width-field">
      <pct-select
        [options]="languages"
        [(value)]="widthField"
        data-testid="select-width-field"
      />
    </pct-field>

    <pct-field
      label="auto — do najdłuższej opcji"
      data-testid="field-width-auto"
    >
      <pct-select
        panelWidth="auto"
        [options]="languages"
        [(value)]="widthAuto"
        data-testid="select-width-auto"
      />
    </pct-field>

    <pct-field
      label="320px, wyrównanie do końca"
      data-testid="field-width-fixed"
    >
      <pct-select
        panelWidth="320px"
        panelAlign="end"
        [options]="languages"
        [(value)]="widthFixed"
        data-testid="select-width-fixed"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="Panel a scoped theme"
  summary="Panel renderuje się poza drzewem hosta, więc kaskada motywu do niego nie dociera — motyw z najbliższego przodka jest przenoszony na panel jawnie."
  [reqs]="['lesson-18', 'req-token-scoped']"
  scheme="dark"
  [controls]="[]"
  data-testid="demo-scoped"
>
  <div class="stack">
    <pct-field label="Kraj (w motywie ciemnym)" data-testid="field-scoped">
      <pct-select
        [options]="countries"
        [(value)]="scopedCountry"
        data-testid="select-scoped"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="Bez obudowy"
  summary="Poza pct-field select rysuje własną etykietę i sam pilnuje obszaru dotyku."
  [reqs]="['req-api-no-wrapper', 'req-a11y-touch']"
  data-testid="demo-standalone"
>
  <pct-select
    label="Kraj"
    [options]="countries"
    [(value)]="bareCountry"
    data-testid="select-bare"
  />
</sbx-demo>
