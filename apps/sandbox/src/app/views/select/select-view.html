<h2 class="view__title">Select</h2>
<p class="muted view__intro">
  Fokus zostaje na triggerze, aktywną opcję wskazuje
  <code>aria-activedescendant</code>. Klawiatura: strzałki, Home/End, Enter,
  Escape i typeahead.
</p>

<sbx-demo
  #wobudowie
  heading="W obudowie"
  summary="Wielkość należy do obudowy — kontrolka oddaje jej swoją, tak jak oddaje ramkę."
  [reqs]="['wym-api-13', 'wym-api-18']"
  data-testid="demo-in-field"
>
  <div class="stack">
    <pct-field
      label="Kraj"
      hint="Lista z własnym panelem (CDK Overlay)"
      [size]="wobudowie.activeSize()"
      data-testid="field-country"
    >
      <pct-select
        [options]="countries"
        [(value)]="country"
        data-testid="select-country"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="Panel a scoped theme"
  summary="Panel renderuje się poza drzewem hosta, więc kaskada motywu do niego nie dociera — motyw z najbliższego przodka jest przenoszony na panel jawnie."
  [reqs]="['wym-real-18', 'wym-theme-4']"
  scheme="dark"
  [controls]="[]"
  data-testid="demo-scoped"
>
  <div class="stack">
    <pct-field label="Kraj (w motywie ciemnym)" data-testid="field-scoped">
      <pct-select
        [options]="countries"
        [(value)]="scopedCountry"
        data-testid="select-scoped"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="Bez obudowy"
  summary="Poza pct-field select rysuje własną etykietę i sam pilnuje obszaru dotyku."
  [reqs]="['wym-api-14', 'wym-a11y-2']"
  data-testid="demo-standalone"
>
  <pct-select
    label="Kraj"
    [options]="countries"
    [(value)]="bareCountry"
    data-testid="select-bare"
  />
</sbx-demo>
