<h2 class="view__title">Radio</h2>
<p class="muted view__intro">
  The options are native <code>&lt;input type="radio"&gt;</code> sharing one
  <code>name</code>, so arrow navigation, wrapping and "one place in the Tab
  order" come from the browser — with no roving tabindex of our own.
</p>

<sbx-demo
  heading="Inside the wrapper"
  summary="The wrapper names the group through aria-labelledby — <label for> does not name a set of elements."
  [reqs]="['req-api-container', 'req-api-parts-unique']"
  data-testid="demo-in-field"
>
  <div class="stack">
    <pct-field
      label="Plan"
      hint="You can change it at any time"
      data-testid="field-plan"
    >
      <pct-radio-group [formField]="userForm.plan" data-testid="radio-plan">
        <pct-radio value="free">Free</pct-radio>
        <pct-radio value="pro">Pro</pct-radio>
        <pct-radio value="enterprise" disabled
          >Enterprise (unavailable)</pct-radio
        >
      </pct-radio-group>
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="With no wrapper, laid out horizontally"
  summary="Outside pct-field the group draws a label of its own and exposes aria-orientation."
  [reqs]="['req-api-no-wrapper', 'req-api-platform']"
  data-testid="demo-standalone"
>
  <pct-radio-group
    label="Horizontal layout"
    orientation="horizontal"
    [(value)]="layoutDemo"
    data-testid="radio-horizontal"
  >
    <pct-radio value="a">Option A</pct-radio>
    <pct-radio value="b">Option B</pct-radio>
  </pct-radio-group>
</sbx-demo>
