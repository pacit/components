<h2 class="view__title">Text</h2>
<p class="muted view__intro">
  A component on a native <code>&lt;input&gt;</code>, not an element of our own:
  it keeps <code>type</code>, the browser autofill and the mobile keyboard mode.
</p>

<sbx-demo
  #types
  heading="Kinds of field"
  summary="type passes through to the native input, so the mobile keyboard and the browser validation work on their own."
  [reqs]="['req-api-native-input']"
  data-testid="demo-types"
>
  <div class="stack">
    <pct-field label="First name" [size]="types.activeSize()">
      <input pctText placeholder="John" data-testid="text-plain" />
    </pct-field>

    <pct-field label="E-mail" [size]="types.activeSize()">
      <input pctText type="email" placeholder="john@example.com" />
    </pct-field>

    <pct-field label="Password" [size]="types.activeSize()">
      <input pctText type="password" autocomplete="current-password" />
    </pct-field>

    <pct-field label="Search" [size]="types.activeSize()">
      <input pctText type="search" placeholder="Search…" />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  #states
  heading="States"
  summary="A disabled field does not invite typing; a read-only one stays focusable."
  [reqs]="['req-api-signals']"
  data-testid="demo-states"
>
  <div class="stack">
    <pct-field label="Disabled" [size]="states.activeSize()">
      <input
        pctText
        value="not editable"
        disabled
        data-testid="text-disabled"
      />
    </pct-field>

    <pct-field label="Read-only" [size]="states.activeSize()">
      <input
        pctText
        value="preview only"
        readonly
        data-testid="text-readonly"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="Compatibility with the old forms API"
  summary="The control implements FormValueControl alone. [formControl] and [(ngModel)] still synchronise the value both ways — with no ControlValueAccessor."
  [reqs]="['req-api-signal-forms', 'lesson-9', 'lesson-26']"
  data-testid="demo-interop"
>
  <div class="stack">
    <pct-field
      label="Reactive forms ([formControl])"
      data-testid="field-reactive"
    >
      <input pctText [formControl]="reactive" data-testid="text-reactive" />
    </pct-field>
    <p class="muted" data-testid="reactive-state">
      the control value: "{{ reactive.value }}"
    </p>

    <pct-field
      label="Template-driven ([(ngModel)])"
      data-testid="field-ngmodel"
    >
      <input pctText [(ngModel)]="ngModelValue" data-testid="text-ngmodel" />
    </pct-field>
    <p class="muted" data-testid="ngmodel-state">
      the model value: "{{ ngModelValue() }}"
    </p>
  </div>
</sbx-demo>
