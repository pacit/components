<h2 class="view__title">Checkbox</h2>
<p class="muted view__intro">
  The <code>FormCheckboxControl</code> contract wants <code>checked</code>, not
  <code>value</code>. The mark is drawn in SVG in <code>currentColor</code> —
  with no dependency on an icon set.
</p>

<sbx-demo
  heading="Inside the wrapper"
  summary="The label is drawn by pct-field; there is no border, because the checkbox declares the bare appearance."
  [reqs]="['req-api-frame', 'req-api-no-wrapper']"
  data-testid="demo-in-field"
>
  <div class="stack">
    <pct-field
      label="Consents"
      hint="Required to open an account"
      data-testid="field-terms"
    >
      <pct-checkbox [formField]="userForm.terms" data-testid="checkbox-terms" />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="With no wrapper"
  summary="Outside pct-field the control draws a label of its own — useful in a table cell, for instance."
  [reqs]="['req-api-no-wrapper', 'req-a11y-touch']"
  data-testid="demo-standalone"
>
  <div class="stack">
    <pct-checkbox
      label='The indeterminate state (aria-checked="mixed")'
      [indeterminate]="partial()"
      data-testid="checkbox-mixed"
    />
    <pct-checkbox label="Checked, disabled" [checked]="true" disabled />
    <pct-checkbox
      label="Read-only — focusable, but not changeable"
      [checked]="true"
      readonly
      data-testid="checkbox-readonly"
    />
  </div>
</sbx-demo>
