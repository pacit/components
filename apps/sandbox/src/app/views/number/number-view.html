<h2 class="view__title">Number</h2>
<p class="muted view__intro">
  A deliberate exception to "do not implement what the platform gives you": a
  native
  <code>&lt;input type="number"&gt;</code> does not know the local decimal
  separator, does not group thousands and drops content it cannot parse.
</p>

<sbx-demo
  #amount
  heading="An amount with cents"
  summary="Formatted by the application locale (fr-FR): a decimal comma, a narrow no-break space as the thousands separator. The text is not rewritten while it is being typed."
  [reqs]="['req-api-number']"
  data-testid="demo-price"
>
  <div class="stack">
    <pct-field
      label="Price"
      hint="The arrows change the value by 0.5"
      [size]="amount.activeSize()"
      data-testid="field-price"
    >
      <span pctPrefix aria-hidden="true">EUR</span>
      <input
        pctNumber
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        [step]="0.5"
        [(value)]="price"
        data-testid="number-price"
      />
      <button
        pctSuffix
        pctButton
        type="button"
        variant="outline"
        size="sm"
        aria-label="Clear the price"
        (click)="clearPrice()"
        data-testid="field-price-clear"
      >
        ×
      </button>
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  #seats
  heading="An integer field with bounds from the schema"
  summary="The bounds are not in the template — the FormField directive takes them from the min()/max() validators, so validation, ARIA and clamping have one source."
  [reqs]="['req-api-number', 'req-api-signal-forms']"
  data-testid="demo-seats"
>
  <div class="stack">
    <pct-field
      label="Number of seats"
      hint="The range is 1–500; a fraction is rounded on commit"
      [size]="seats.activeSize()"
      data-testid="field-seats"
    >
      <input
        pctNumber
        [formField]="userForm.seats"
        data-testid="number-seats"
      />
      <span pctSuffix aria-hidden="true">pcs</span>
    </pct-field>
  </div>
</sbx-demo>
