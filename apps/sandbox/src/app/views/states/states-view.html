<h2 class="view__title">States</h2>
<p class="muted view__intro">
  The same set of states for every control. No state is made with
  <code>opacity</code> — each has colour tokens of its own, because transparency
  changes the contrast at runtime in a way the gate cannot see.
</p>

<sbx-demo
  #idle
  heading="Idle"
  summary="The point of reference for the remaining cards."
  [controls]="['scheme', 'skin', 'size']"
  data-testid="states-idle"
>
  <div class="states">
    <pct-field label="Text" [size]="idle.activeSize()">
      <input pctText [(value)]="text" data-testid="idle-text" />
    </pct-field>

    <pct-field label="Number" [size]="idle.activeSize()">
      <input
        pctNumber
        [maxFractionDigits]="2"
        [(value)]="amount"
        data-testid="idle-number"
      />
    </pct-field>

    <pct-field label="List" [size]="idle.activeSize()">
      <pct-select
        [options]="countries"
        [(value)]="country"
        data-testid="idle-select"
      />
    </pct-field>

    <pct-field label="Consent">
      <pct-checkbox [(checked)]="checked" data-testid="idle-checkbox" />
    </pct-field>

    <pct-field label="Plan">
      <pct-radio-group [(value)]="plan" data-testid="idle-radio">
        <pct-radio value="a">A</pct-radio>
        <pct-radio value="b">B</pct-radio>
      </pct-radio-group>
    </pct-field>

    <pct-field label="Backups">
      <pct-switch [(checked)]="backups" data-testid="idle-switch" />
    </pct-field>

    <div class="states__cell">
      <button pctButton [size]="idle.activeSize()" data-testid="idle-button">
        Button
      </button>
    </div>
  </div>
</sbx-demo>

<sbx-demo
  #disabled
  heading="Disabled"
  summary="The cursor announces that no action follows across the whole surface of the border, and the colours come from the disabled-* tokens."
  [reqs]="['req-token-no-opacity', 'lesson-27']"
  [controls]="['scheme', 'skin', 'size']"
  data-testid="states-disabled"
>
  <div class="states">
    <pct-field label="Text" [size]="disabled.activeSize()">
      <input pctText [value]="text()" disabled data-testid="disabled-text" />
    </pct-field>

    <pct-field label="Number" [size]="disabled.activeSize()">
      <input
        pctNumber
        [maxFractionDigits]="2"
        [value]="amount()"
        disabled
        data-testid="disabled-number"
      />
    </pct-field>

    <pct-field label="List" [size]="disabled.activeSize()">
      <pct-select
        [options]="countries"
        [value]="country()"
        disabled
        data-testid="disabled-select"
      />
    </pct-field>

    <pct-field label="Consent">
      <pct-checkbox [checked]="true" disabled data-testid="disabled-checkbox" />
    </pct-field>

    <pct-field label="Plan">
      <pct-radio-group [value]="plan()" disabled data-testid="disabled-radio">
        <pct-radio value="a">A</pct-radio>
        <pct-radio value="b">B</pct-radio>
      </pct-radio-group>
    </pct-field>

    <pct-field label="Backups">
      <pct-switch [checked]="true" disabled data-testid="disabled-switch" />
    </pct-field>

    <div class="states__cell">
      <button
        pctButton
        [size]="disabled.activeSize()"
        disabled
        data-testid="disabled-button"
      >
        Button
      </button>
    </div>
  </div>
</sbx-demo>

<sbx-demo
  #readonly
  heading="Read-only"
  summary="The value cannot be changed, but the control stays focusable — otherwise it would drop out of the Tab order and a screen reader would not read it out."
  [reqs]="['req-api-signals']"
  [controls]="['scheme', 'skin', 'size']"
  data-testid="states-readonly"
>
  <div class="states">
    <pct-field label="Text" [size]="readonly.activeSize()">
      <input pctText [value]="text()" readonly data-testid="readonly-text" />
    </pct-field>

    <pct-field label="Number" [size]="readonly.activeSize()">
      <input
        pctNumber
        [maxFractionDigits]="2"
        [value]="amount()"
        readonly
        data-testid="readonly-number"
      />
    </pct-field>

    <pct-field label="List" [size]="readonly.activeSize()">
      <pct-select
        [options]="countries"
        [value]="country()"
        readonly
        data-testid="readonly-select"
      />
    </pct-field>

    <pct-field label="Consent">
      <pct-checkbox [checked]="true" readonly data-testid="readonly-checkbox" />
    </pct-field>

    <pct-field label="Plan">
      <pct-radio-group [value]="plan()" readonly data-testid="readonly-radio">
        <pct-radio value="a">A</pct-radio>
        <pct-radio value="b">B</pct-radio>
      </pct-radio-group>
    </pct-field>

    <pct-field label="Backups">
      <pct-switch [checked]="true" readonly data-testid="readonly-switch" />
    </pct-field>

    <p class="muted states__note">
      A button has no "read-only" state — its counterpart is being disabled.
    </p>
  </div>
</sbx-demo>

<sbx-demo
  #invalid
  heading="A validation error"
  summary="The message is drawn by the wrapper, which binds it to the control through aria-describedby; the border signals the error with a colour from a token."
  [reqs]="['req-api-wrapper', 'req-a11y-built-in']"
  [controls]="['scheme', 'skin', 'size']"
  data-testid="states-invalid"
>
  <div class="states">
    <pct-field label="Text" [size]="invalid.activeSize()">
      <input
        pctText
        [value]="text()"
        [invalid]="true"
        [touched]="true"
        [errors]="errors"
        data-testid="invalid-text"
      />
    </pct-field>

    <pct-field label="Number" [size]="invalid.activeSize()">
      <input
        pctNumber
        [maxFractionDigits]="2"
        [value]="amount()"
        [invalid]="true"
        [touched]="true"
        [errors]="errors"
        data-testid="invalid-number"
      />
    </pct-field>

    <pct-field label="List" [size]="invalid.activeSize()">
      <pct-select
        [options]="countries"
        [value]="country()"
        [invalid]="true"
        [touched]="true"
        [errors]="errors"
        data-testid="invalid-select"
      />
    </pct-field>

    <pct-field label="Consent">
      <pct-checkbox
        [checked]="false"
        [invalid]="true"
        [touched]="true"
        [errors]="errors"
        data-testid="invalid-checkbox"
      />
    </pct-field>

    <pct-field label="Plan">
      <pct-radio-group
        [value]="''"
        [invalid]="true"
        [touched]="true"
        [errors]="errors"
        data-testid="invalid-radio"
      >
        <pct-radio value="a">A</pct-radio>
        <pct-radio value="b">B</pct-radio>
      </pct-radio-group>
    </pct-field>

    <pct-field label="Backups">
      <pct-switch
        [checked]="false"
        [invalid]="true"
        [touched]="true"
        [errors]="errors"
        data-testid="invalid-switch"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  #loading
  heading="Loading"
  summary="A state of the button alone: it blocks the click and announces that through aria-busy."
  [reqs]="['req-api-signals']"
  [controls]="['scheme', 'skin', 'size']"
  data-testid="states-loading"
>
  <div class="row">
    <button
      pctButton
      [size]="loading.activeSize()"
      loading
      data-testid="loading-button"
    >
      Saving
    </button>
    <button
      pctButton
      variant="outline"
      [size]="loading.activeSize()"
      loading
      data-testid="loading-outline"
    >
      Saving
    </button>
  </div>
</sbx-demo>
