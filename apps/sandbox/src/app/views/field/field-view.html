<h2 class="view__title">Field</h2>
<p class="muted view__intro">
  The wrapper supplies the label, the hint, the error message and the decoration
  slots. It does not implement the form contract — the control inside does.
</p>

<sbx-demo
  #basics
  heading="Label, hint and error"
  summary="Below the field there is one line only: the hint, and once a field with an error is left — the error message in its place. The label points at the control across the projection boundary, and aria-describedby points at whichever line is lit."
  [reqs]="['req-api-wrapper', 'req-a11y-built-in']"
  data-testid="demo-basics"
>
  <div class="stack">
    <pct-field
      label="E-mail"
      hint="A work address"
      [size]="basics.activeSize()"
      data-testid="field-email"
    >
      <input
        pctText
        type="email"
        placeholder="john@example.com"
        [formField]="userForm.email"
      />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  #aux
  heading="A label aux and a character counter"
  summary="The slots outside the border carry side content: [pctLabelAux] beside the label (an 'i' icon, say) and [pctMessageAux] in the message row (a character counter, say). The counter stands there whether the line below the field lights up a hint or an error."
  [reqs]="['req-api-wrapper']"
  data-testid="demo-aux"
>
  <div class="stack">
    <pct-field
      label="A short description"
      hint="Briefly — write at least 10 characters"
      [size]="aux.activeSize()"
      data-testid="field-bio"
    >
      <button
        pctLabelAux
        type="button"
        class="field-view__info"
        aria-label="The description appears on your profile"
        title="The description appears on your profile"
      >
        <!-- A plain letter with a CSS ring, not U+24D8: the circled glyph sits outside
             Liberation Sans, so every machine drew it from a different fallback face and
             the visual baseline failed on CI over exactly its 52 pixels. -->
        i
      </button>

      <input
        pctText
        placeholder="A few words about yourself"
        [formField]="bioForm.bio"
        data-testid="bio-input"
      />

      <span pctMessageAux aria-hidden="true" data-testid="bio-counter">
        {{ bioModel().bio.length }}/{{ bioMax }}
      </span>
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  #affix
  heading="Decorations inside the border"
  summary="The prefix and the suffix lie inside the border, so the focus ring takes in the whole row — including when the focus lands on a button in a slot. The fit of a slot is the author's choice: 'inset' lies on the surface of the field (inherits its cursor, a click focuses the control), 'fill' takes the whole slot and is a surface of its own (its own background, its own cursor, it takes the click itself)."
  [reqs]="['req-api-wrapper', 'lesson-27', 'lesson-34']"
  data-testid="demo-affix"
>
  <div class="stack">
    <!-- The "EUR" tile (fill) + a button smaller than its slot (inset). -->
    <pct-field
      label="Price"
      hint="The unit tile is a surface of its own; the clear button sits in the border padding"
      [size]="affix.activeSize()"
      data-testid="field-price"
    >
      <span
        pctPrefix="fill"
        class="field-view__unit"
        aria-hidden="true"
        data-testid="field-price-unit"
      >
        EUR
      </span>
      <input
        pctNumber
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        [step]="0.5"
        [(value)]="price"
        data-testid="number-price"
      />
      <button
        pctSuffix
        pctButton
        type="button"
        variant="outline"
        size="sm"
        aria-label="Clear the price"
        (click)="clearPrice()"
        data-testid="field-price-clear"
      >
        ×
      </button>
    </pct-field>

    <!-- An icon with no background (inset) + a button filling its slot (fill). -->
    <pct-field
      label="Search the catalogue"
      hint="The icon belongs to the surface of the field; the button is welded into the corner of the border"
      [size]="affix.activeSize()"
      data-testid="field-search"
    >
      <span pctPrefix aria-hidden="true" data-testid="field-search-icon">
        🔍
      </span>
      <input
        pctText
        placeholder="a name or a symbol"
        [(value)]="query"
        data-testid="text-search"
      />
      <button
        pctSuffix="fill"
        pctButton
        type="button"
        [size]="affix.activeSize()"
        data-testid="field-search-submit"
      >
        Search
      </button>
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  #surface
  heading="The whole surface of the border has an owner"
  summary="The cursor announces what a click will do across the whole border: text, pointer, and under disabled — no action."
  [reqs]="['lesson-27', 'req-api-frame']"
  data-testid="demo-surface"
>
  <div class="stack">
    <pct-field
      label="Country"
      hint="A click in the padding opens the list"
      [size]="surface.activeSize()"
      data-testid="field-country"
    >
      <pct-select [options]="countries" [formField]="userForm.country" />
    </pct-field>

    <pct-field
      label="Disabled"
      [size]="surface.activeSize()"
      data-testid="field-disabled"
    >
      <input pctText value="not editable" disabled />
    </pct-field>

    <pct-field
      label="Read-only"
      [size]="surface.activeSize()"
      data-testid="field-readonly"
    >
      <input pctText value="preview only" readonly />
    </pct-field>
  </div>
</sbx-demo>

<sbx-demo
  heading="Controls with no border (bare)"
  summary="Around a checkbox and a radio group a border looks alien — the wrapper then gives the label, the hint and the message alone."
  [reqs]="['req-api-frame']"
  data-testid="demo-bare"
>
  <div class="stack">
    <pct-field
      label="Consents"
      hint="Required to open an account"
      data-testid="field-bare-checkbox"
    >
      <pct-checkbox [(checked)]="consent" />
    </pct-field>

    <pct-field label="Plan" data-testid="field-bare-radio">
      <pct-radio-group [(value)]="plan">
        <pct-radio value="free">Free</pct-radio>
        <pct-radio value="pro">Pro</pct-radio>
      </pct-radio-group>
    </pct-field>
  </div>
</sbx-demo>
