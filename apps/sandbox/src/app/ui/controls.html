@if (has('scheme')) {
<pct-radio-group
  label="Theme"
  orientation="horizontal"
  [value]="scheme()"
  (valueChange)="setScheme($event)"
  data-testid="control-scheme"
>
  <pct-radio value="light">light</pct-radio>
  <pct-radio value="dark">dark</pct-radio>
</pct-radio-group>
} @if (has('size')) {
<pct-radio-group
  label="Size"
  orientation="horizontal"
  [value]="size()"
  (valueChange)="setSize($event)"
  data-testid="control-size"
>
  <pct-radio value="sm">sm</pct-radio>
  <pct-radio value="md">md</pct-radio>
  <pct-radio value="lg">lg</pct-radio>
</pct-radio-group>
} @if (has('dir')) {
<pct-radio-group
  label="Direction"
  orientation="horizontal"
  [value]="dir()"
  (valueChange)="setDir($event)"
  data-testid="control-dir"
>
  <pct-radio value="ltr">ltr</pct-radio>
  <pct-radio value="rtl">rtl</pct-radio>
</pct-radio-group>
} @if (has('skin') && hasSkins) {
<pct-field label="Skin" size="sm" data-testid="control-skin">
  <pct-select
    [options]="skins"
    [value]="skin()"
    (valueChange)="setSkin($event)"
  />
</pct-field>
}
