<header class="demo__head">
  <div class="demo__intro">
    <h3 class="demo__heading">{{ heading() }}</h3>
    @if (summary()) {
    <p class="demo__summary">{{ summary() }}</p>
    } @if (reqs().length) {
    <p class="demo__reqs">
      @for (req of reqs(); track req) {
      <code>{{ req }}</code>
      }
    </p>
    }
  </div>

  @if (controls().length) {
  <sbx-controls
    class="demo__controls"
    [show]="controls()"
    [(scheme)]="activeScheme"
    [(skin)]="activeSkin"
    [(size)]="activeSize"
    [(dir)]="activeDir"
  />
  }
</header>

<!-- The stage: the only place where the card theme is in force. The theme goes through
     the library's own [pctTheme] — the sandbox is the directive's first consumer, and the
     hand-written attribute it replaced lives on in the kitchen-sink's scoped panel as the
     other half of the req-token-directive control. -->
<div
  class="demo__stage"
  [pctTheme]="activeScheme()"
  [attr.data-skin]="activeSkin()"
  [attr.dir]="activeDir()"
  data-testid="demo-stage"
>
  <ng-content />
</div>
