<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Chart probes</title>
    <style>
      body { margin: 0; font: 13px/1.4 system-ui, sans-serif; }
      #stage { position: relative; width: 1400px; height: 500px; }
      #stage svg, #stage canvas { position: absolute; inset: 0; }
      #stage path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #touch { width: 600px; height: 300px; background: #eef; touch-action: pan-y; }
      #tall { height: 3000px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <main id="root">
      <h1>Chart probes</h1>
      <div id="stage"></div>
      <svg id="labels" width="800" height="40" style="font: 12px system-ui, sans-serif"></svg>
      <div id="touch"></div>
      <div id="a11y"></div>
      <div id="tall"></div>
    </main>
    <script src="page.js"></script>
  </body>
</html>
