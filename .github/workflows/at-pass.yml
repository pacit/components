# The assistive-technology pass on all three readers: NVDA with Firefox on Windows, VoiceOver
# with Safari on macOS, and — since the pass stopped needing a desktop (position 4.73) — Orca
# with Firefox on a headless GNOME Shell the job stands up itself, on Ubuntu 26.04, the first
# image whose GNOME has `--headless`. `tools/at-pass.sh` is the same script a maintainer runs.
#
# DISPATCHED FOR A READING, SCHEDULED FOR A SMOKE TEST, and the two are different errands.
# The reading moves when the components move and not when the clock does, so nothing here runs
# thirty-six views on a timer. The weekly run walks the default single view: its subject is
# this FILE — whether the runners still come up, the setup still resolves, the readers still
# speak — and that subject does rot on a clock, in somebody else's repository. It is 4.67's
# third shape, decided: `workflow_dispatch` alone is a promise that a file works, and the
# first dispatch of this one found the promise false in `Set up job`. Free since the flip
# (0075 wrote the metered stage, and the flip ended it).
#
# ON A SCHEDULE THE `inputs` CONTEXT IS EMPTY — not filled with the defaults declared below,
# which is the opposite of what `workflow_dispatch` does with a blank value. Read directly,
# `inputs.readers` would match neither job's condition and a weekly run would skip both jobs
# and report green; `inputs.routes` would arrive empty, which `routesAsked()` reads as EVERY
# view. Both are handled at their use: the conditions say which reader is EXCLUDED, so an
# empty value runs both, and the route falls back in the expression that reads it.
#
# NOTHING HERE CAN DRIVE EITHER READER — no desk in this project has Windows or macOS — so a
# dispatch of this file is its own test as much as its reading. `routes` defaults to a single view
# for exactly that reason: find out whether the arrangement speaks at all before paying for
# thirty-six views of it. Pass `all` to walk them — NOT an empty value, which `workflow_dispatch`
# replaces with the default, so a dispatch asking for everything quietly walked one view.
#
# The first dispatch, 2026-09-15, was the test and not the reading: both jobs died inside
# `Set up job` on `guidepup/setup-action@v2` — a version that has never existed, since the
# action is tagged `0.21.0` and carries no major-version refs at all. It is the same class as
# the dead constant found in `at-pass.mjs` the same day (`lesson-210`): a name that resolves
# to nothing, sitting in a file nothing had ever executed. Every `uses:` in every workflow
# here was then checked against the remote, and this was the only one.
name: Assistive-technology pass

on:
  workflow_dispatch:
    inputs:
      routes:
        description: 'Comma-separated routes, or `all` for every view'
        required: false
        default: '/accordion'
      readers:
        description: 'Which readers to run'
        required: false
        default: 'all'
        type: choice
        options: [all, nvda, voiceover, orca]
  schedule:
    # 06:30 UTC on Mondays, behind the end-to-end probe's 05:00 so two heavy dispatch-only
    # files do not ask for runners in the same minute. The hour is a preference: GitHub
    # queues scheduled work behind the load of the hour.
    - cron: '30 6 * * 1'

permissions:
  contents: read

concurrency:
  group: at-pass
  cancel-in-progress: false

jobs:
  nvda:
    # Which reader is EXCLUDED, not which is asked for: on a schedule `inputs` is empty,
    # and an empty value has to mean the declared default rather than no job at all.
    if: inputs.readers != 'voiceover' && inputs.readers != 'orca'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      # Installs the reader and puts the environment in the state it needs — the step that
      # makes screen-reader automation possible on a hosted runner at all. It is the CLI and
      # NOT `guidepup/setup-action`, which was tried first: at 0.21.0 it failed VoiceOver with
      # "Failed to mount Guidepup preferences" on `macos-26`. Guidepup's own workflows do not
      # use the action either — they call this, at this version, in THIS ORDER, with `setup`
      # before the install of anything else and `install` after it. The order is copied rather
      # than reasoned about, because upstream's CI is the only evidence available from here.
      - run: npx -y --min-release-age=0 @guidepup/setup@0.24.6 setup --ci

      - run: npm ci

      - run: npx playwright install --with-deps firefox

      - run: npx -y --min-release-age=0 @guidepup/setup@0.24.6 install

      - name: Read the views with NVDA
        env:
          AT_PASS_ROUTES: ${{ inputs.routes || '/accordion' }}
        run: npx playwright test --config apps/sandbox-e2e/at.config.mts --project nvda-firefox

      # The record is rendered by the same script the Orca pass uses, so all three readers
      # land in one shape. `none` is where a debug file would go: this reader was asked what
      # it said rather than read out of a log afterwards.
      - if: always()
        run: >
          node tools/at-pass.mjs --render tmp/at/nvda-firefox-windows.steps.json none
          nvda-firefox-windows "NVDA with Firefox on Windows"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: at-pass-nvda
          path: |
            docs/acr/at/nvda-firefox-windows.md
            tmp/at/nvda-firefox-windows.steps.json
          retention-days: 30
          if-no-files-found: warn

  voiceover:
    # The mirror of the condition on the job above, and empty runs it for the same reason.
    if: inputs.readers != 'nvda' && inputs.readers != 'orca'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      # The CLI and the order, for the reason recorded in the Windows job above.
      # `--macos-record` is upstream's, and it is kept rather than trimmed: the flag that looks
      # like it only turns on a recording sits next to the mount that was failing, and this
      # workflow is in no position to tell which of the two it belongs to.
      - run: npx -y --min-release-age=0 @guidepup/setup@0.24.6 setup --ci --macos-record

      - run: npm ci

      - run: npx playwright install --with-deps webkit

      - run: npx -y --min-release-age=0 @guidepup/setup@0.24.6 install

      - name: Read the views with VoiceOver
        env:
          AT_PASS_ROUTES: ${{ inputs.routes || '/accordion' }}
        run: npx playwright test --config apps/sandbox-e2e/at.config.mts --project voiceover-safari

      - if: always()
        run: >
          node tools/at-pass.mjs --render tmp/at/voiceover-safari-macos.steps.json none
          voiceover-safari-macos "VoiceOver with Safari on macOS"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: at-pass-voiceover
          path: |
            docs/acr/at/voiceover-safari-macos.md
            tmp/at/voiceover-safari-macos.steps.json
          retention-days: 30
          if-no-files-found: warn

  orca:
    # The reader this file could not run until 2026-09-17: `tools/at-pass.sh` needed the
    # maintainer's desktop, and a runner has none. Since the pass stands up a headless GNOME
    # Shell of its own (position 4.73), a runner is exactly the machine it was written for —
    # on Ubuntu 26.04, the first image whose GNOME (50) has `--headless`; 24.04 ships 46.
    if: inputs.readers != 'nvda' && inputs.readers != 'voiceover'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      # The compositor, the reader, the speech server and the seat helper's bindings — the
      # same things the script asks a desktop machine for, from the image's own apt.
      - name: The compositor, the reader and the speech server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell orca speech-dispatcher espeak-ng python3-gi gir1.2-glib-2.0 dbus-daemon at-spi2-core iproute2 wayland-utils

      - run: npm ci

      - run: npx playwright install --with-deps firefox

      # Served OUTSIDE the pass, on purpose: the script refuses to start a dev server from
      # inside its own session bus and compositor (`at-orca.config.mts` says why).
      - name: Serve the sandbox
        run: |
          mkdir -p tmp
          npx nx run sandbox:serve > tmp/sandbox-serve.log 2>&1 &
          for ((i = 0; i < 150; i++)); do curl -sf -o /dev/null http://localhost:4200 && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:4200

      - name: Read the views with Orca
        env:
          AT_PASS_ROUTES: ${{ inputs.routes || '/accordion' }}
          # The protocol as the browser sees it, while the runner's reading is still silent.
          AT_PASS_TRACE: '1'
        run: tools/at-pass.sh http://localhost:4200

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: at-pass-orca
          path: |
            docs/acr/at/orca-firefox-linux.md
            tmp/at/steps.json
            tmp/at/orca.debug
            tmp/at/drive.log
            tmp/at/shell.log
            tmp/at/gsettings.log
            tmp/at/wayland-info.log
            tmp/at/wayland-info-after.log
            tmp/at/seat.out
            tmp/at/spd.out
            tmp/sandbox-serve.log
          retention-days: 30
          if-no-files-found: warn
