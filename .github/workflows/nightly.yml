# The nightly full run: `run-many`, not `affected` — everything, every night, on the
# hardware CI really has. It exists for what a quiet `main` never exercises: the
# clock-wobble distribution of the mutation gate on shared vCPUs (the measurement the
# plan's CI item has been missing), toolchain and dependency rot between pushes, and the
# environment-dependent roads (the consumer gate's registry, the dictionary restore's
# archive on a cold cache) that only fail when the world under them moves.
#
# TWO JOBS, and the split is the whole point of the arrangement. `mutation` and `e2e` used
# to share one runner in one `run-many` line, so nx was free to start both at once on four
# vCPUs — and a mutant killed by the CLOCK is killed only while the machine cooperates.
# Measured over identical code, that is worth 3.5 points on `core/src/motion.ts` and 9 on
# `core/src/placement.ts`: a red gate on a file nobody edited. Since they run on runners of
# their own, the clock column of a nightly is no longer decided by what the OTHER heavy gate
# is doing.
#
# The price is one more `npm ci` per night — ~58 s, on a runner nothing else is waiting for.
# It is NOT a second Playwright restore: the mutation job is vitest and needs no browser, so
# it takes the shorter setup and the browsers stay in the job that uses them.
#
# A MATRIX JOB was the shape first drawn, and it is refused on a measurement rather than on
# taste: with one templated `run` line the targets stand behind `${{ matrix.… }}`, and point 7
# of `check-mutation` reads the WORDS on every `nx` line of both workflows — so the gate whose
# job is to notice `mutation` leaving CI would stop being able to see it here. Two jobs with
# literal lines stay readable to the gate and to a person by the same property, and the
# duplication costs four steps.
#
# What the split does NOT buy is the four vCPUs themselves. Stryker still runs with the
# workers a small runner allows, so whether the nightly starts LANDING the clock-kills the
# snapshot was written from is a question the first night after this answers, not one this
# comment may.
#
# NEITHER JOB CACHES nx task results, and unlike ci.yml — which does, over `.nx/cache` and
# the workspace-data database together — that is the point of this workflow rather than an
# omission. Everything here is a re-measurement from nothing: the clock-kill distribution of
# the mutation gate, the rot between pushes, the roads that depend on the world outside the
# repository. A restored result is a reading another machine took on another day, so a cache
# here would answer the one question this file exists to ask. The wobble on an untouched file
# is answered by the runner split above and by the snapshot it is measured against — not by
# freezing the reading that measures it.
# NIGHTLY AGAIN, from 2026-09-15, and the episode is kept here because the arithmetic that
# forced it is the kind nobody does twice. A private repository on a free account has 2000
# Actions minutes a month; the run of 2026-09-11 spent 123 of them on `mutation
# check-mutation e2e` alone against 2 on the whole static battery, and fourteen such nights
# plus the pushes came to 2080. Every job of every push from 13:02 on 2026-09-14 was refused
# with "the job was not started because ... your spending limit needs to be increased" — a
# wall reached by design and by nobody's arithmetic. The stopgap was weekly.
#
# It reversed at the flip, as written. Actions is unbilled on a PUBLIC repository, so the
# weekly cadence was a property of the private stage (0075) and not of the work: the
# repository went public on 2026-09-15, the cron came back to daily, and nothing else here
# changed. The file keeps its name throughout, because the lessons and decisions that cite
# it are a record of when it was one (position 4.63).
name: Scheduled full run

on:
  schedule:
    # 02:30 UTC — a red result has the working day in front of it rather than behind.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # The same two-step Playwright arrangement as ci.yml, and for the same reason: the
      # cache never covers the system libraries, and every engine must be named in BOTH
      # branches or it silently disappears on the first cache hit.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # The same pinned word lists as ci.yml: the gate restores and verifies them out of
      # `tools/dictionaries.lock.json` itself, the cache only spares the download.
      - uses: actions/cache@v4
        with:
          path: tools/.dictionaries
          key: dictionaries-${{ hashFiles('tools/dictionaries.lock.json') }}

      - run: npx nx format:check

      # The full set ci.yml runs on a diff, run over everything. It stays a step of its own
      # rather than joining the line below, so its wall-clock is readable per run straight
      # off the job's step timings — the number the plan's CI item exists to learn.
      - run: npx nx run-many -t lint test vite:test build content typecheck check-package check-coverage check-bench check-zoneless check-typecheck check-styles check-files check-texts check-tokens check-forms check-bridge check-parts check-harness check-aria check-icons check-bundle check-consumer check-browsers check-e2e check-language check-reach check-support check-distance check-acr check-docs check-prose check-index check-tools

      - run: npx nx run-many -t e2e

  # The third runner, and the only job here whose subject is the suite rather than the code:
  # it runs both browser suites `--repeat-each` times over with retries OFF and asks which
  # cases did not agree with themselves. It cannot share the `full` runner — the failure mode
  # being measured IS contention, so a repetition run beside a full `run-many` would report
  # the load and call it a flake rate.
  #
  # Both repetition steps tolerate a non-zero exit, and that is not laxity: with retries off a
  # single wobble fails the run, and the gate has to see the report to say which case it was.
  # What stops an ordinary red suite from being swallowed here is point 3 of `check-flake` —
  # a case that failed EVERY repetition is reported as a failure and not as a wobble.
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # The same two-step Playwright arrangement as the job above, and every engine named in
      # BOTH branches for the same reason.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # One suite at a time, and not `run-many`: the two applications serve on their own ports
      # and a docs suite running beside a sandbox dev server reads the load rather than the
      # page. `--repeat-each` is the operational number and lives here; the FLOOR under it is
      # `minimumRepetitions` in `tools/flake.policy.json`, which is what refuses a run that
      # could not have found anything.
      - name: Repeat the sandbox suite
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tmp/flake/sandbox-e2e.json
        run: npx nx run sandbox-e2e:e2e --repeat-each=3 --retries=0 --reporter=json

      - name: Repeat the docs suite
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tmp/flake/docs-e2e.json
        run: npx nx run docs-e2e:e2e --repeat-each=3 --retries=0 --reporter=json

      # `always()`, because a step above may have been the one that found something.
      - if: always()
        run: npx nx run-many -t check-flake

      # The reports are what a `--write` of the record is taken from, and they live on this
      # runner's disk. Without this the first reading would have to be taken again by hand on
      # a machine that measures something else (`lesson-200`).
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-reports
          path: tmp/flake/
          retention-days: 30
          if-no-files-found: error

  # The other heavy gate, on a runner of its own. The setup is deliberately the short one:
  # no browsers and no word lists — Stryker runs vitest here, and `check-mutation` reads the
  # report this job's own run leaves on this runner's disk, which is why the two targets are
  # one line and cannot be moved apart.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx nx run-many -t mutation check-mutation
