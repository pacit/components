name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# A superseded run keeps burning the runner without one: two pushes in a minute are two
# hour-class suites running to completion for one merge-worthy result. Cancelling the older
# is safe exactly because nx-set-shas below keys on the last GREEN run, not the last run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    # Twice the worst full run yet measured (~50 min mutation + ~20 min e2e, sequential
    # worst case) — a ceiling for a hung browser, not a budget for a slow one. GitHub's own
    # default is six hours, which on a metered private stage is a bill, not a ceiling.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          # `nx affected` derives its comparison base from history; a shallow clone
          # leaves it nothing to compare against.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Sets NX_BASE and NX_HEAD: the merge base on a pull request, the last commit
      # with a green run of this workflow on main — so a failed run does not hand the
      # next one a narrower diff than it should check.
      - uses: nrwl/nx-set-shas@v4

      # The cache key is the Playwright version, so it is invalidated when the package
      # moves rather than on every package-lock.json change. All three engines
      # (`req-quality-browsers`) must be listed in BOTH install steps below: the
      # cache-hit one installs system libraries only, so an engine named in the miss
      # branch alone silently disappears on the first hit. `check-browsers` (point 5)
      # is what notices.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # System libraries are installed on every run: they live outside the browser
      # directory, so the cache never covers them. The browsers themselves only on a miss.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # The language gate's word lists are a pinned input, not a runner fact: the gate
      # restores them itself out of `tools/dictionaries.lock.json`, hash-verified on every
      # run, so this cache never has to be trusted — it only spares the archive a 9 MB
      # download, and a miss costs seconds, not correctness. The apt step that stood here
      # answered the first run's ENOENT with whatever version the runner's release shipped;
      # the divergence its comment was waiting for got measured the day of the pin, when
      # one package name served two lists and the pool had rotated the older one away.
      - uses: actions/cache@v4
        with:
          path: tools/.dictionaries
          key: dictionaries-${{ hashFiles('tools/dictionaries.lock.json') }}

      - run: npx nx format:check

      # One line runs every gate. Which promise each of them proves — and which
      # reference control keeps it honest — is in docs/registry.md, generated from
      # the requirements, so the mapping cannot drift from them quietly. A gate
      # explains what it measures in its own header under tools/; why it exists at
      # all belongs to the requirement it implements and the lesson it came from.
      # Tokens are not built by a step of their own: `tokens` is a graph dependency
      # of its consumers, and a manual build here would only mask a missing edge.
      #
      # `mutation` and `check-mutation` are NOT in this line while the stage is private:
      # they run nightly (nightly.yml), which is the private stage's declared default —
      # a metered runner cannot pay ~50 minutes of Stryker per push, and the first full
      # run measured exactly the co-scheduling the plan's CI item predicted. The docs
      # gate reads both workflows, so the pair still counts as wired into CI.
      - run: npx nx affected -t lint test vite:test build content typecheck check-package check-coverage check-bench check-zoneless check-typecheck check-styles check-texts check-tokens check-bridge check-parts check-aria check-icons check-bundle check-consumer check-browsers check-language check-reach check-support check-acr check-docs check-index e2e

      # A red e2e on a runner is unreadable without its evidence: the third run failed two
      # visual baselines and the diff images died with the machine, so the failure could
      # only be guessed at. Kept on failure alone — green runs prove themselves. The glob,
      # not one suite's path: the day docs-e2e turned red the same way, this step was still
      # spelling `sandbox-e2e` and the landing's diffs died with the machine again.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: dist/.playwright/apps/*/test-output
          retention-days: 7
          if-no-files-found: ignore
