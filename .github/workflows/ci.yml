name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npx nx format:check

      # Tokeny (CSS/SCSS/TS + bramka kontrastu) buduje graf: `tokens` jest
      # zależnością `components` i `sandbox`, więc powstają same, przed
      # konsumentami. Ręczny krok przed run-many maskowałby brak tej krawędzi.
      # `check-package` weryfikuje spakowany artefakt — że wozi skórkę i że
      # każdy użyty token ma w pakiecie deklarację.
      - run: npx nx run-many -t lint test vite:test build typecheck check-package e2e
