name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          # `nx affected` derives its comparison base from history; a shallow clone
          # leaves it nothing to compare against.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Sets NX_BASE and NX_HEAD: the merge base on a pull request, the last commit
      # with a green run of this workflow on main — so a failed run does not hand the
      # next one a narrower diff than it should check.
      - uses: nrwl/nx-set-shas@v4

      # The cache key is the Playwright version, so it is invalidated when the package
      # moves rather than on every package-lock.json change. All three engines
      # (`req-quality-browsers`) must be listed in BOTH install steps below: the
      # cache-hit one installs system libraries only, so an engine named in the miss
      # branch alone silently disappears on the first hit. `check-browsers` (point 5)
      # is what notices.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # System libraries are installed on every run: they live outside the browser
      # directory, so the cache never covers them. The browsers themselves only on a miss.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - run: npx nx format:check

      # One line runs every gate. Which promise each of them proves — and which
      # reference control keeps it honest — is in docs/registry.md, generated from
      # the requirements, so the mapping cannot drift from them quietly. A gate
      # explains what it measures in its own header under tools/; why it exists at
      # all belongs to the requirement it implements and the lesson it came from.
      # Tokens are not built by a step of their own: `tokens` is a graph dependency
      # of its consumers, and a manual build here would only mask a missing edge.
      - run: npx nx affected -t lint test vite:test build typecheck check-package check-coverage check-zoneless check-typecheck check-styles check-texts check-tokens check-parts check-bundle check-consumer check-browsers mutacja check-mutation check-docs e2e
