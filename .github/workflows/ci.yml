name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Tokeny generują CSS/SCSS/TS (dist/ jest w .gitignore) i uruchamiają bramkę
      # kontrastu — muszą powstać przed build/test/e2e.
      - run: node libs/tokens/build.mjs

      - run: npx nx format:check
      - run: npx nx run-many -t lint test vite:test build typecheck e2e
