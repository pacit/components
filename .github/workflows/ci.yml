name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # For the release commit alone. Its push is the bot's, with `GITHUB_TOKEN`, and a push
  # made with that token starts no workflow — so the one commit on `main` that moves the
  # manifest was the one commit with no verdict, and the site behind `workflow_run` stayed
  # a release behind (lesson-243). `release.yml` dispatches this workflow after its push:
  # a dispatch is one of the two events the token may raise.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# A superseded run keeps burning the runner without one: two pushes in a minute are two
# hour-class suites running to completion for one merge-worthy result. Cancelling the older
# is safe exactly because nx-set-shas keys on the last GREEN run, not the last run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The run is TWO kinds of job, and the split comes from a measurement rather than from a
# taste for matrices. In the single job this workflow used to be, 68 minutes were spent so:
# 2.5 on all 44 tasks of the battery — every lint, test, build and gate — and 66 on the two
# Playwright suites, which nx ran one after the other. The cache was never the answer: a
# perfect one would have saved those 2.5 minutes (measured on run 35375241392, 2026-09-18).
#
# The first run of the arrangement below answered in 17.1 minutes with all seven jobs green
# (35401914426): the battery in 4.2, the six shards from 8.4 to 17.0.
#
# So the suites are what got split, and they are split ACROSS MACHINES rather than across
# workers on one. Nx's preset sets `workers: process.env.CI ? 1 : undefined`, and that one
# worker stays: four cases in this repository fail their first attempt and pass on a retry
# in a freshly started browser (lesson-214), and load on the machine is the one condition
# they are known to react to. A shard is a whole runner to itself, so every test meets the
# same idle machine it met before — what changes is how many machines, not what happens on
# one. Raising the worker count would be the other, cheaper change, and it is deliberately
# not this one.
jobs:
  # Everything that is not a browser: 44 tasks, ~2.5 minutes of work, and the job that owns
  # the nx cache (the composite action says why only one may).
  gates:
    runs-on: ubuntu-latest
    # The battery has measured 2.5 minutes of work and 4.2 of job; this is a ceiling for a
    # task that hangs, not a budget for a slow one.
    timeout-minutes: 30
    # The browsers come with the machine and not off a mirror (0081, amended 2026-10-07).
    # This job needs them for a gate rather than for a suite: `check-browsers` point 6 probes
    # every engine for the facts its exclusions appeal to, and `check-consumer` renders the
    # packed library in chromium. The image is Playwright's own, built by its `install-deps`
    # and `install chromium firefox webkit`, so it carries all three engines and every library
    # they link — what the four steps that stood here installed on every run, off
    # azure.archive.ubuntu.com: 41 seconds at the median, and one run in 58 minutes.
    #
    # The tag is EXACTLY the `@playwright/test` version in package-lock.json, and
    # `check-browsers` (point 5) refuses any other — in this file and in every other workflow —
    # so the bump that moves the lockfile is the commit that has to move this line. `--user
    # 1001` is the option Playwright's CI documentation gives for GitHub Actions: the uid the
    # runner itself runs as, which owns the workspace and the `$HOME` it mounts in. As root the
    # job would own neither, and Firefox is the engine reported to refuse a home somebody
    # else owns.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          # `nx affected` derives its comparison base from history; a shallow clone
          # leaves it nothing to compare against. The e2e job below checks out the same
          # way and for the same reason — a shallow clone there would leave `nx affected`
          # unable to decide whether a suite is affected at all.
          fetch-depth: 0

      - uses: ./.github/actions/workspace
        with:
          nx-cache: save

      # TEMPORARY — the first run in the image measures what the job meets there; removed
      # before merge, its readings go to 0081.
      - name: Probe the container
        shell: bash
        run: |
          set +e
          id; echo "HOME=$HOME"; cat /etc/hosts; cat /etc/resolv.conf | grep -v '^#'
          cat /proc/sys/net/ipv6/conf/lo/disable_ipv6; cat /proc/sys/net/ipv6/conf/all/disable_ipv6
          getent ahosts localhost; env | grep -i -E 'proxy|^NODE_|^npm_config' | sed 's/=.*/=…/'
          cat > "$RUNNER_TEMP/registry.mjs" <<'JS'
          import { spawn } from 'node:child_process';
          import { lookup } from 'node:dns/promises';
          import { mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          console.log('lookup', JSON.stringify(await lookup('localhost', { all: true })));
          const port = 45729;
          const storage = mkdtempSync(join(tmpdir(), 'v-'));
          const proc = spawn(process.execPath, ['node_modules/verdaccio/bin/verdaccio', '--config', '.verdaccio/config.yml', '--listen', String(port)], { env: { ...process.env, VERDACCIO_STORAGE_PATH: storage }, stdio: ['ignore', 'pipe', 'pipe'] });
          let log = '';
          proc.stdout.on('data', (d) => (log += d));
          proc.stderr.on('data', (d) => (log += d));
          proc.on('exit', (code, signal) => console.log('verdaccio exited', code, signal));
          const seen = new Map();
          let ok = false;
          for (let i = 0; i < 80 && !ok; i++) {
            for (const host of ['localhost', '127.0.0.1', '[::1]']) {
              let r;
              try { const res = await fetch(`http://${host}:${port}/-/ping`, { signal: AbortSignal.timeout(2000) }); r = `status ${res.status}`; if (host === 'localhost') ok = res.status < 500; }
              catch (e) { r = `${e.name} ${e.cause?.code ?? ''} ${e.cause?.message ?? e.message}`; }
              const key = `${host}: ${r}`;
              if (!seen.has(key)) { seen.set(key, i); console.log(`#${i} ${key}`); }
            }
            if (!ok) await new Promise((res) => setTimeout(res, 250));
          }
          console.log('ready', ok);
          console.log(log.slice(0, 3000));
          proc.kill();
          JS
          timeout 120 node "$RUNNER_TEMP/registry.mjs"

      - run: npx nx format:check

      # One line runs every gate. Which promise each of them proves — and which
      # reference control keeps it honest — is in docs/registry.md, generated from
      # the requirements, so the mapping cannot drift from them quietly. A gate
      # explains what it measures in its own header under tools/; why it exists at
      # all belongs to the requirement it implements and the lesson it came from.
      # Tokens are not built by a step of their own: `tokens` is a graph dependency
      # of its consumers, and a manual build here would only mask a missing edge.
      #
      # `e2e` is the one target not on this line — it has a job of its own below, and
      # `scripts/before-push` reads BOTH lines, so the local battery still knows the whole
      # list. `mutation` and `check-mutation` are on neither: they run nightly
      # (nightly.yml), where ~50 minutes of Stryker is a night's work rather than a push's.
      # The docs gate reads both workflows, so every pair still counts as wired into CI.
      #
      # `scripts/nx-verdict` RUNS nx rather than reading it off a pipe: nx ended nine runs
      # without its summary and with exit code 0, red tasks inside them (plan 4.72,
      # lesson-222). Read off a pipe the summary is not to be trusted at all: Node drops
      # what is still buffered there when it leaves through `process.exit()`, as nx does —
      # a run whose tasks were all cached lost thousands of lines and the summary with them,
      # twice on 2026-09-18 (lesson-228). The runner writes nx to a file, follows it live,
      # and fails a run whose file carries no verdict; nx's own non-zero code still wins.
      - shell: bash
        run: scripts/nx-verdict npx nx affected -t lint test vite:test build content typecheck check-package check-coverage check-bench check-zoneless check-typecheck check-styles check-files check-texts check-tokens check-forms check-bridge check-parts check-harness check-aria check-icons check-bundle check-consumer check-browsers check-e2e check-language check-reach check-support check-since check-distance check-acr check-docs check-prose check-index check-tools

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gates-output
          path: tmp/nx-verdict.log
          retention-days: 7
          if-no-files-found: ignore

  # The browsers. Every job here runs `nx affected -t e2e` over a SHARD of the suites, and
  # the eight of them together run each affected suite exactly once. Eight since 2026-10-07
  # (0088), six before: the tail shard measured 23 minutes at six (37537775744) once this
  # job became the push's whole e2e verdict, and a job is free on a public repository. The
  # first run at eight: 7.6 to 11.4 minutes per shard, 13.1 for the run (37655766884).
  #
  # The denominator is `strategy.job-total` and never a number typed beside it. That is the
  # whole guard against the failure this arrangement could have: a matrix of eight with
  # `--shard=N/10` would run four fifths of the tests and report green on the rest, which
  # is the worst thing a test suite can do. Written this way the two cannot disagree — the
  # denominator IS the number of jobs. `check-browsers` (point 5) refuses a literal one.
  #
  # `fail-fast: false` because a red shard is not a reason to cancel the evidence in the
  # other seven: the question after a failure is always which tests failed, and a cancelled
  # shard answers nothing.
  e2e:
    runs-on: ubuntu-latest
    # The first sharded run measured 8.4 to 17.0 minutes per shard (35401914426), the spread
    # being webkit's share of the slow files rather than anything about the split. Three times
    # the worst of them is a ceiling for a browser that hangs; what bounds a merely slow one
    # is Playwright's own per-test timeout.
    timeout-minutes: 60
    # The same image as the gates job, for the reason given there. Here it is the suite's own
    # machine: every engine the configuration declares, the fonts the visual baselines pin
    # (`fonts-liberation`, in the image's `install-deps` layer), and no apt on the way in.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          # The same full history as the gates job, and for the reason stated there.
          fetch-depth: 0

      - uses: ./.github/actions/workspace

      # TEMPORARY — the first run in the image measures what the job meets there; removed
      # before merge, its readings go to 0081.
      - name: Probe the container
        shell: bash
        run: |
          set +e
          id; echo "HOME=$HOME shell=$BASH_VERSION"; head -2 /etc/os-release
          echo "context=${{ github.workspace }} env=$GITHUB_WORKSPACE pwd=$(pwd)"
          node -v; npm -v; git --version; command -v zstd || echo 'no zstd'
          date; ls -l /etc/localtime; cat /etc/timezone 2>/dev/null || echo 'no /etc/timezone'
          df -h /dev/shm /tmp; nproc; head -2 /proc/meminfo
          git rev-parse --is-shallow-repository; git rev-list --count HEAD
          echo "NX_BASE=$NX_BASE NX_HEAD=$NX_HEAD"; git merge-base --is-ancestor "$NX_BASE" HEAD && echo 'base is an ancestor'
          ls /ms-playwright

      # `--shard` stands BEFORE `-t`, and the target list is the last thing on the line.
      # That is a convention five readers depend on — `scripts/before-push` and the four
      # gates that read this file through `tools/workflow-targets.mjs` — each taking the
      # words after `-t` as targets, up to the first option. Playwright's own server serves
      # the suite (the `webServer` block in each playwright.config.mts says so), so a shard
      # builds and starts the app it tests and stops it after.
      #
      # The emptiness is decided here rather than inside `scripts/nx-verdict`. A job that
      # names ONE target meets a commit that reaches no suite — a root document, say — and
      # nx then prints `No tasks were run` and exits 0 with no verdict, which that script
      # refuses and should go on refusing: it prints the same sentence for a target list
      # that is a typo, and a run that checked nothing because nobody can spell is not a run
      # that checked nothing because there was nothing. The two are told apart by asking the
      # workspace, and asking it twice: some project HAS an `e2e` target (a typo empties
      # this list too), and none of them is affected.
      - shell: bash
        run: |
          if ! suites=$(npx nx show projects -t e2e); then
            echo "::error::nx could not list the projects of this workspace, so nothing below can say whether a suite was skipped or lost."
            exit 1
          fi
          named=$(printf %s "$suites" | tr -d '[]\" \n\r\t')
          if [ -z "$named" ]; then
            echo "::error::no project in this workspace has an \`e2e\` target — the suites this job exists to run have been renamed or lost, and an empty affected set below would have looked like a quiet afternoon."
            exit 1
          fi
          if ! affected=$(npx nx show projects --affected -t e2e); then
            echo "::error::nx could not say which suites this commit affects — which is not the same answer as none, and this job will not read it as one."
            exit 1
          fi
          touched=$(printf %s "$affected" | tr -d '[]\" \n\r\t')
          if [ -z "$touched" ]; then
            echo "No suite is affected by this commit — shard ${{ matrix.shard }} has nothing to run."
            exit 0
          fi
          scripts/nx-verdict npx nx affected --shard=${{ matrix.shard }}/${{ strategy.job-total }} -t e2e

      # A red e2e on a runner is unreadable without its evidence: the third run this
      # workflow ever made failed two visual baselines and the diff images died with the
      # machine, so the failure could only be guessed at. Kept on failure alone — green runs
      # prove themselves. The name carries the shard because two jobs of one run may not
      # upload the same artifact name.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output-${{ matrix.shard }}
          path: |
            dist/.playwright/apps/*/test-output
            tmp/nx-verdict.log
          retention-days: 7
          if-no-files-found: ignore
