name: Pages

# The documentation site, deployed to GitHub Pages at https://components.pacit.pl — the
# host, the trigger and what they cost are decision 0078.
#
# `workflow_run` and not `push`: the site follows `main` only through a commit whose CI run
# concluded green, so what a visitor reads is a commit every gate passed and never the head
# of the branch. Two consequences, both deliberate: `completed` covers `failure` and
# `cancelled` too (and CI cancels superseded runs), so the job checks the conclusion itself;
# and the commit built is the run's own `head_sha`, not `github.sha`, which under
# `workflow_run` is merely the branch head at the time the event fired.
#
# The dispatch exists for the first deploy only: `workflow_run` cannot fire for a workflow
# file that is not on the default branch yet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # the deployment
  id-token: write # deploy-pages authenticates the artifact with OIDC

# The opposite of ci.yml's `cancel-in-progress: true`, on purpose: a gate run superseded
# mid-way is minutes wasted, a deploy cancelled mid-way is a site in an unknown state. One
# site, one queue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # No restore of the nx cache, and since CI caches again (2026-10-08, lesson-255) that is
      # a measurement of what it would buy rather than of a step that could not work. The
      # entry CI saves is written in Playwright's image and belongs to that machine twice
      # over, as the composite action says: a gzip archive, which a runner with `zstd` asks
      # another version for, and a database named by the image's machine id. So restoring
      # here means building in the image, and the image does not pay for itself. Measured on
      # 37740388032, a 58-second job: `npm ci` took 24 seconds and `nx build docs` ran its
      # five tasks cold in 17.5. In the image `node_modules` restores in about 8 and a full
      # hit would leave little of the build, but the pull alone takes 27 seconds at the
      # median (0081, amended) — about even at best, for a deploy that would then hang on a
      # 956 MB image and on the cache's chain. The step that stood here until 2026-10-08
      # read `Cache: 0/5 hit` on every run after Nx 23.2.1 (37579021492); the build runs cold,
      # as it has since.

      - uses: actions/configure-pages@v6

      # `build` pulls the token pipeline, the library build and the content pass through its
      # own `dependsOn`; nothing else is needed and no browser is installed here.
      - run: npx nx build docs

      # The host serves the root `404.html` for any unknown path, with a real 404 status.
      # The page is prerendered under `/404` (app.routes.server.ts); `cp` rather than `mv`
      # keeps `/404` a visitable route, which is how the e2e sweep reaches it.
      - run: cp dist/apps/docs/browser/404/index.html dist/apps/docs/browser/404.html

      # `browser/` and nothing above it: the parent holds `prerendered-routes.json` and the
      # third-party licence roll-up, neither of which is a page.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/apps/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
