name: Release

# Manual only, a dry run by default, and two runs where there used to be one (decision 0094).
# `main` takes only a commit whose CI checks went green, and nothing bypasses that — so the release commit cannot be pushed there by the bot. The `prepare` run
# bumps, stamps, renders the CHANGELOG and commits, then pushes the commit to
# `release/<version>`, dispatches CI on it and opens the pull request; a person squash-merges
# it. The `publish` run, dispatched on `main` after that, stages the merged commit on npm and
# only then tags it and creates the GitHub Release, both public the moment they exist. The
# trusted publisher this workflow runs as may only *stage*: the version goes live when a
# maintainer approves it with 2FA (decision 0079, amended 2026-09-17). The publish stays in
# this file because npm knows the publisher by the workflow file's name.
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'prepare = the release pull request; publish = stage, tag and release the merged release commit'
        type: choice
        options: [prepare, publish]
        default: prepare
      dry_run:
        description: 'Dry run — nothing is pushed, tagged or staged'
        type: boolean
        default: true
      specifier:
        description: 'prepare: empty = derived from conventional commits; or patch/minor/major/1.2.3'
        type: string
        required: false
        default: ''
      first_release:
        description: 'prepare: first release (no previous tag to count the range from)'
        type: boolean
        default: false

permissions:
  contents: write # release branch, tag, GitHub Release entry
  pull-requests: write # the release pull request
  id-token: write # OIDC: npm trades it for the trusted publisher's short-lived token, and signs provenance
  actions: write # read: the CI run of the commit about to be published; write: CI dispatched on the release branch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Releases go from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release goes from main; this workflow was started from ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Full history and tags: both the current version
          # (`currentVersionResolver: git-tag`) and the CHANGELOG come from them.
          fetch-depth: 0

      # The publish goes out of the release commit, not out of whatever `main` is by now: a
      # merge after the release pull request would put commits under the tag that the
      # CHANGELOG does not list, and the `@since next` they carry undated. The commit is the
      # one that wrote the manifest's version, and it is checked out before `npm ci`, so the
      # tree installed is the tree that is built. `release.mjs` then holds it to being a
      # release commit, untagged, with a green CI run on `main`.
      - name: The release commit
        if: inputs.step == 'publish'
        run: |
          VERSION=$(jq -r .version libs/components/package.json)
          SHA=$(git log -1 --format=%H -S"\"version\": \"$VERSION\"" -- libs/components/package.json)
          if [ -z "$SHA" ]; then
            echo "::error::No commit on main wrote components@$VERSION into the manifest."
            exit 1
          fi
          echo "components@$VERSION was written by $SHA"
          git checkout --detach "$SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          # No `registry-url`, on purpose, since 2026-09-17. With it, setup-node writes an
          # .npmrc whose `_authToken` line reads NODE_AUTH_TOKEN, and nobody sets that any
          # more: npm keeps an unset variable as literal text and takes the text for a
          # credential, so a dry run could no longer tell a refused OIDC exchange from a working
          # one. Without it, the registry is npm's default and the only credential this run
          # ever holds is the short-lived token the exchange returns at publish time
          # (`lib/utils/oidc.js` in the CLI). No stored token to leak, no secret to rotate.

      - run: npm ci

      - name: Git identity for the release commit and the tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # No npm token here, on purpose: the registry authenticates this run by its OIDC
      # identity (repository and workflow file, configured on the package), and that identity
      # may only `npm stage publish`. The script says what a person does next in the job summary.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inputs travel through the environment rather than interpolation into
          # `run`, so a text field cannot reach the shell as code.
          SPECIFIER: ${{ inputs.specifier }}
          FIRST_RELEASE: ${{ inputs.first_release }}
          DRY_RUN: ${{ inputs.dry_run }}
          STEP: ${{ inputs.step }}
        run: |
          ARGS=()
          if [ "$STEP" = "publish" ]; then ARGS+=("--publish"); fi
          if [ -n "$SPECIFIER" ]; then ARGS+=("--specifier=$SPECIFIER"); fi
          if [ "$FIRST_RELEASE" = "true" ]; then ARGS+=("--first-release"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=("--dry-run"); fi
          node tools/release.mjs "${ARGS[@]}"
