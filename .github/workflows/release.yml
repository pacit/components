name: Release

# Manual only, and a dry run by default. The run cuts the tag and the GitHub Release, and
# both are public the moment they exist — a deliberate click is safer here than an
# automatic run on every merge to main. The publish itself stops one step short: the
# trusted publisher this workflow runs as may only *stage* on npm, and the version goes
# live when a maintainer approves it with 2FA (decision 0079, amended 2026-09-17).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — nothing is tagged or staged'
        type: boolean
        default: true
      specifier:
        description: 'Version: empty = derived from conventional commits; or patch/minor/major/1.2.3'
        type: string
        required: false
        default: ''
      first_release:
        description: 'First release (no previous tag to count the range from)'
        type: boolean
        default: false

permissions:
  contents: write # CHANGELOG commit, tag, GitHub Release entry
  id-token: write # OIDC: npm trades it for the trusted publisher's short-lived token, and signs provenance
  actions: write # read: the CI run of the commit about to be published; write: CI dispatched on the release commit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Releases go from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release goes from main; this workflow was started from ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Full history and tags: both the current version
          # (`currentVersionResolver: git-tag`) and the CHANGELOG come from them.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          # No `registry-url`, on purpose, since 2026-09-17. With it, setup-node writes an
          # .npmrc whose `_authToken` line reads NODE_AUTH_TOKEN, and nobody sets that any
          # more: npm keeps an unset variable as literal text and takes the text for a
          # credential, so a dry run could no longer tell a refused OIDC exchange from a working
          # one. Without it, the registry is npm's default and the only credential this run
          # ever holds is the short-lived token the exchange returns at publish time
          # (`lib/utils/oidc.js` in the CLI). No stored token to leak, no secret to rotate.

      - run: npm ci

      # The one guard a rehearsal cannot give the publish: the commit about to go out carries
      # a CI run, and that run concluded green. A check-run query rather than `needs:`, because
      # this workflow is dispatched by hand against whatever `main` is at the time — and of
      # the gates CI runs, the release path re-runs only the build and the package gate. The
      # publish is the one gate whose failure a consumer inherits forever.
      - name: The commit went green in CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&per_page=1" \
            --jq '.workflow_runs[0] | select(. != null) | "\(.status) \(.conclusion)"')
          echo "CI on ${GITHUB_SHA}: ${RUN:-no run}"
          if [ "$RUN" != "completed success" ]; then
            echo "::error::${GITHUB_SHA} has no green CI run on main (${RUN:-none}) — nothing is published from a commit the gates have not passed."
            exit 1
          fi

      - name: Git identity for the release commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # No npm token here, on purpose: the registry authenticates this run by its OIDC
      # identity (repository and workflow file, configured on the package), and that identity
      # may only `npm stage publish`. The script says what a person does next in the job summary.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inputs travel through the environment rather than interpolation into
          # `run`, so a text field cannot reach the shell as code.
          SPECIFIER: ${{ inputs.specifier }}
          FIRST_RELEASE: ${{ inputs.first_release }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$SPECIFIER" ]; then ARGS+=("--specifier=$SPECIFIER"); fi
          if [ "$FIRST_RELEASE" = "true" ]; then ARGS+=("--first-release"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=("--dry-run"); fi
          node tools/release.mjs "${ARGS[@]}"

      # The push above is the bot's, with `GITHUB_TOKEN`, and a push made with that token
      # starts no workflow: after `0.2.0` the release commit stood on `main` for six and a
      # half hours with no CI verdict — red, as it turned out — and the site, which deploys
      # behind a green CI (`pages.yml`, decision 0078), stayed at the commit before it
      # (lesson-243). A dispatch is one of the two events the token may raise, so CI is
      # dispatched on `main` here: the release commit earns its verdict, and Pages follows
      # CI's `workflow_run`. A dry run pushed nothing and dispatches nothing. A real run
      # dispatches even when the step above failed, because it can fail AFTER its push —
      # the stage is the last thing it does — and the commit is on `main` either way; when
      # the failure came before the push, the price is one more run of an unmoved, green
      # `main`. Not when the script never ran, though: a run the guard refused (CI still in
      # progress on `main`) pushed nothing, and a dispatch would only cancel and restart
      # the run the guard was waiting for. `--ref main` names the branch, not the commit:
      # a merge landing in the seconds between the push and the dispatch takes the run,
      # and covers the release commit with it.
      - name: CI on the release commit, and the site after it
        if: ${{ !inputs.dry_run && !cancelled() && steps.release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main
