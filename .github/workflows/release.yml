name: Release

# Manual only, and a dry run by default. Publishing cannot be undone — a published
# npm version can be deprecated but not withdrawn — so a deliberate click is safer
# here than an automatic run on every merge to main.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — nothing is tagged or published'
        type: boolean
        default: true
      specifier:
        description: 'Version: empty = derived from conventional commits; or patch/minor/major/1.2.3'
        type: string
        required: false
        default: ''
      first_release:
        description: 'First release (no previous tag to count the range from)'
        type: boolean
        default: false

permissions:
  contents: write # CHANGELOG commit, tag, GitHub Release entry
  id-token: write # OIDC for `npm publish --provenance`
  actions: read # the CI run of the commit about to be published

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Releases go from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release goes from main; this workflow was started from ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Full history and tags: both the current version
          # (`currentVersionResolver: git-tag`) and the CHANGELOG come from them.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          # Writes an .npmrc pointing at the registry and reading NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The one guard a rehearsal cannot give the publish: the commit about to go out carries
      # a CI run, and that run concluded green. A check-run query rather than `needs:`, because
      # this workflow is dispatched by hand against whatever `main` is at the time — and of
      # the gates CI runs, the release path re-runs only the build and the package gate. The
      # publish is the one gate whose failure a consumer inherits forever.
      - name: The commit went green in CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&per_page=1" \
            --jq '.workflow_runs[0] | select(. != null) | "\(.status) \(.conclusion)"')
          echo "CI on ${GITHUB_SHA}: ${RUN:-no run}"
          if [ "$RUN" != "completed success" ]; then
            echo "::error::${GITHUB_SHA} has no green CI run on main (${RUN:-none}) — nothing is published from a commit the gates have not passed."
            exit 1
          fi

      - name: Git identity for the release commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm adds provenance on its own once it sees this variable and an OIDC
          # token. It needs a correct `repository` field in the package manifest,
          # which `check-package.mjs --release` checks before publishing.
          NPM_CONFIG_PROVENANCE: true
          # Inputs travel through the environment rather than interpolation into
          # `run`, so a text field cannot reach the shell as code.
          SPECIFIER: ${{ inputs.specifier }}
          FIRST_RELEASE: ${{ inputs.first_release }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$SPECIFIER" ]; then ARGS+=("--specifier=$SPECIFIER"); fi
          if [ "$FIRST_RELEASE" = "true" ]; then ARGS+=("--first-release"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=("--dry-run"); fi
          node tools/release.mjs "${ARGS[@]}"
