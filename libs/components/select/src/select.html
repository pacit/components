@if (label() && !inField) {
<span class="pct-select__label" data-pct-part="label" [id]="labelId">
  {{ label() }} @if (required()) {
  <span class="pct-select__required" aria-hidden="true">*</span>
  }
</span>
}

<button
  #trigger
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  class="pct-select__trigger"
  data-pct-part="trigger"
  type="button"
  role="combobox"
  [id]="triggerId"
  [disabled]="disabled()"
  [attr.name]="name() || null"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? listboxId : null"
  aria-haspopup="listbox"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-labelledby]="!inField && label() ? labelId : null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="showInvalid() ? 'true' : null"
  [attr.aria-required]="required() || null"
  [attr.aria-readonly]="readonly() ? 'true' : null"
  (click)="toggle()"
  (keydown)="onKeydown($event)"
  (blur)="onBlur()"
>
  @if (displayText()) {
  <span class="pct-select__text" data-pct-part="value"
    >{{ displayText() }}</span
  >
  } @else {
  <span class="pct-select__placeholder" data-pct-part="placeholder">
    {{ placeholderText() }}
  </span>
  }

  <svg
    class="pct-select__arrow"
    data-pct-part="arrow"
    viewBox="0 0 16 16"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M4 6l4 4 4-4" />
  </svg>
</button>

<!--
  Panel: szerokość i wyrównanie liczone względem kotwicy (ramka pola w obudowie,
  trigger poza nią). `push` wsuwa do okna panel, który się w nim nie mieści —
  szerszy od kontrolki (`panelWidth="auto"` albo szerokość wprost) potrafi wyjść
  poza krawędź, a przycięte opcje są nie do odczytania.
-->
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="anchor() ?? origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="panelPositions()"
  [cdkConnectedOverlayWidth]="overlayWidth()"
  [cdkConnectedOverlayMinWidth]="overlayMinWidth()"
  [cdkConnectedOverlayPush]="true"
  cdkConnectedOverlayPanelClass="pct-select__overlay"
  (overlayOutsideClick)="close()"
  (detach)="close()"
>
  <div
    #panel
    class="pct-select__panel"
    data-pct-part="panel"
    role="listbox"
    [id]="listboxId"
    [attr.data-theme]="panelTheme()"
    [attr.dir]="panelDir()"
    [style.font-family]="panelFont()?.family"
    [style.font-size]="panelFont()?.size"
    [attr.aria-labelledby]="label() ? labelId : null"
  >
    @for (option of options(); track option.value; let i = $index) {
    <!--
      Wzorzec ARIA listbox: fokus zostaje na triggerze, a aktywną opcję wskazuje
      `aria-activedescendant` (lekcja-18). Opcje z założenia nie są fokusowalne
      i nie mają własnej obsługi klawiatury — ta siedzi na triggerze
      (`(keydown)="onKeydown($event)"`). Obie reguły są tu fałszywie dodatnie.
    -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <div
      class="pct-select__option"
      data-pct-part="option"
      role="option"
      [id]="optionId(i)"
      [attr.aria-selected]="i === selectedIndex()"
      [attr.aria-disabled]="option.disabled ? 'true' : null"
      [attr.data-pct-active]="i === activeIndex() ? '' : null"
      [attr.data-pct-selected]="i === selectedIndex() ? '' : null"
      [attr.data-pct-disabled]="option.disabled ? '' : null"
      (click)="selectAt(i)"
      (mouseenter)="option.disabled ? null : activeIndex.set(i)"
    >
      {{ option.label }}
    </div>
    } @empty {
    <div class="pct-select__empty" data-pct-part="empty">
      {{ texts().selectEmpty }}
    </div>
    }
  </div>
</ng-template>

@if (hint() && !inField) {
<span class="pct-select__hint" data-pct-part="hint" [id]="hintId">
  {{ hint() }}
</span>
} @if (showError()) {
<span
  class="pct-select__error"
  data-pct-part="error"
  [id]="errorId"
  role="alert"
>
  {{ errorText() }}
</span>
}
