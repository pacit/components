<!-- Wiersz etykiety: nazwa pola po lewej, opcjonalny dodatek (np. ikona „i",
     licznik) po prawej. Renderujemy go, gdy jest etykieta albo dodatek —
     inaczej pusty wiersz dokładałby sam odstęp. -->
@if (label() || labelAux()) {
<div class="pct-field__header" data-pct-part="field-header">
  @if (label()) {
  <label
    class="pct-field__label"
    data-pct-part="field-label"
    [id]="labelId"
    [attr.for]="labelFor()"
  >
    {{ label() }} @if (isRequired()) {
    <span class="pct-field__required" aria-hidden="true">*</span>
    }
  </label>
  }
  <span class="pct-field__label-aux" data-pct-part="field-label-aux">
    <ng-content select="[pctLabelAux]"></ng-content>
  </span>
</div>
}

<!-- Rząd pola: dekoracje po bokach i kontrolka w środku. Sloty są opcjonalne;
     kolejność w DOM odpowiada kolejności wizualnej, więc fokus idzie naturalnie. -->

<!--
  Rząd nie jest własnym celem interakcji — tylko przekazuje kliknięcie w swoje
  tło kontrolce, która leży w środku i ma pełną obsługę klawiatury. Duplikat
  obsługi klawiszy tutaj tworzyłby drugi cel Taba. Reguła jest fałszywie dodatnia.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
  class="pct-field__row"
  data-pct-part="field-row"
  (mousedown)="onRowPointerDown($event)"
  (click)="onRowClick($event)"
>
  <span class="pct-field__prefix" data-pct-part="field-prefix">
    <ng-content select="[pctPrefix]"></ng-content>
  </span>

  <span class="pct-field__control" data-pct-part="field-control">
    <ng-content></ng-content>
  </span>

  <span class="pct-field__suffix" data-pct-part="field-suffix">
    <ng-content select="[pctSuffix]"></ng-content>
  </span>
</div>

<!--
  Pod polem tylko jedna linia. Błąd ma pierwszeństwo nad podpowiedzią: gdy
  świeci, podpowiedź znika — inaczej pole rosłoby o wiersz przy każdym błędzie,
  a `aria-describedby` mógłby wskazywać element, którego użytkownik nie widzi.
  Po prawej stronie tej samej linii stoi opcjonalny dodatek (np. licznik znaków),
  niezależny od tego, który komunikat akurat świeci.
-->
@if (showError() || hint() || messageAux()) {
<div class="pct-field__footer" data-pct-part="field-footer">
  <span class="pct-field__message">
    @if (showError()) {
    <span
      class="pct-field__error"
      data-pct-part="field-error"
      [id]="errorId"
      role="alert"
    >
      {{ errorText() }}
    </span>
    } @else if (hint()) {
    <span class="pct-field__hint" data-pct-part="field-hint" [id]="hintId">
      {{ hint() }}
    </span>
    }
  </span>
  <span class="pct-field__message-aux" data-pct-part="field-message-aux">
    <ng-content select="[pctMessageAux]"></ng-content>
  </span>
</div>
}
