<!-- Label row: the field name at the start, an optional add-on (an "i" icon, a counter) at
     the end. Rendered when there is a label or an add-on — otherwise an empty row would add
     nothing but a gap. -->
@if (label() || labelAux()) {
<div class="pct-field__header" data-pct-part="field-header">
  @if (label()) {
  <label
    class="pct-field__label"
    data-pct-part="field-label"
    [id]="labelId"
    [attr.for]="labelFor()"
  >
    {{ label() }} @if (isRequired()) {
    <span class="pct-field__required" aria-hidden="true">*</span>
    }
  </label>
  }
  <span class="pct-field__label-aux" data-pct-part="field-label-aux">
    <ng-content select="[pctLabelAux]"></ng-content>
  </span>
</div>
}

<!-- Field row: decorations on the sides and the control in the middle. The slots are
     optional; DOM order matches visual order, so focus moves naturally. -->

<!--
  The row is not an interaction target of its own — it only passes a click on its background
  to the control, which sits inside and has full keyboard handling. Duplicating key handling
  here would create a second Tab target. The rule is a false positive.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
  #row
  class="pct-field__row"
  data-pct-part="field-row"
  (mousedown)="onRowPointerDown($event)"
  (click)="onRowClick($event)"
>
  <span class="pct-field__prefix" data-pct-part="field-prefix">
    <ng-content select="[pctPrefix]"></ng-content>
  </span>

  <span class="pct-field__control" data-pct-part="field-control">
    <ng-content></ng-content>
  </span>

  <span class="pct-field__suffix" data-pct-part="field-suffix">
    <ng-content select="[pctSuffix]"></ng-content>
  </span>
</div>

<!--
  One line only below the field. The error wins over the hint: while it is lit the hint goes
  away — otherwise the field would grow by a row on every error, and `aria-describedby` could
  point at an element the user cannot see. At the end of that same line stands an optional
  add-on (a character counter, say), independent of which message is lit.
-->
@if (showError() || hint() || messageAux()) {
<div class="pct-field__footer" data-pct-part="field-footer">
  <span class="pct-field__message">
    @if (showError()) {
    <span
      class="pct-field__error"
      data-pct-part="field-error"
      [id]="errorId"
      role="alert"
    >
      {{ errorText() }}
    </span>
    } @else if (hint()) {
    <span class="pct-field__hint" data-pct-part="field-hint" [id]="hintId">
      {{ hint() }}
    </span>
    }
  </span>
  <span class="pct-field__message-aux" data-pct-part="field-message-aux">
    <ng-content select="[pctMessageAux]"></ng-content>
  </span>
</div>
}
