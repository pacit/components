<!--
  The chevron, declared once and drawn in both buttons. A second copy would be a second
  drawing to keep in step and a second copy of its bytes in the artefact (`lesson-67`), and
  the two buttons differ by a quarter turn the STYLESHEET applies — `:dir()` picks the way it
  turns, which is the platform's own answer to "whichever way this is written"
  (`req-token-logical`; measured to work in all three engines).
-->
<ng-template #chevron>
  <pct-icon name="chevron-down">
    <svg
      viewBox="0 0 16 16"
      width="100%"
      height="100%"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      focusable="false"
    >
      <path d="M4 6l4 4 4-4" />
    </svg>
  </pct-icon>
</ng-template>

<div class="pct-calendar__header">
  <button
    type="button"
    class="pct-calendar__nav pct-calendar__nav--back"
    data-pct-part="nav"
    [disabled]="disabled() || !canGoBack()"
    [attr.aria-label]="texts().datePreviousMonth"
    (click)="step(-1)"
  >
    <ng-container [ngTemplateOutlet]="chevron" />
  </button>

  <!--
    The month over the grid, and the one thing in this control that CHANGES without the user
    having moved anything they can see — a keyboard step from 31 January lands in February and
    the caption is the only part that says so. `aria-live="polite"` is what makes that
    audible, and `polite` because the user is still walking (`req-a11y-built-in`, and 0026's
    reading of who owns which channel).
  -->
  <div
    class="pct-calendar__caption"
    data-pct-part="caption"
    [id]="captionId"
    aria-live="polite"
  >
    {{ caption() }}
  </div>

  <button
    type="button"
    class="pct-calendar__nav pct-calendar__nav--forward"
    data-pct-part="nav"
    [disabled]="disabled() || !canGoForward()"
    [attr.aria-label]="texts().dateNextMonth"
    (click)="step(1)"
  >
    <ng-container [ngTemplateOutlet]="chevron" />
  </button>
</div>

<!--
  A `<table role="grid">` and not a stack of divs: the rows and the columns are real, so the
  platform's own table semantics are the ones a reader announces the cell's row and column
  from, and `role="grid"` is the one addition that turns a static table into a walkable one
  (`req-api-platform`). The keydown sits on the grid rather than on every cell — one listener,
  and the cursor is the component's state and not the DOM's.

  `tabindex="-1"` is programmatic focus and never a tab stop: it is what the grid falls back
  to when a panel opens with no cell to land on, and it is also the element the NAME belongs
  to — the role is here, so `ariaLabel` / `ariaLabelledby` are bound here and nowhere else.
-->
<table
  #grid
  class="pct-calendar__grid"
  data-pct-part="grid"
  role="grid"
  tabindex="-1"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-labelledby]="ariaLabelledby() || (ariaLabel() ? null : captionId)"
  [attr.aria-disabled]="disabled() ? 'true' : null"
  (keydown)="onGridKeydown($event)"
>
  <thead>
    <tr>
      @for (weekday of weekdays(); track $index) {
      <th class="pct-calendar__weekday" data-pct-part="weekday" scope="col">
        <span aria-hidden="true">{{ weekday.narrow }}</span>
        <!--
          The narrow name is ambiguous BY DESIGN — English has `S` for Saturday and for
          Sunday — so the column a reader hears is the long one. Two readings of the same
          platform data rather than one abbreviated by us.
        -->
        <span class="pct-calendar__sr">{{ weekday.long }}</span>
      </th>
      }
    </tr>
  </thead>

  <tbody>
    @for (week of weeks(); track $index) {
    <tr class="pct-calendar__week" data-pct-part="week">
      @for (cell of week; track cell.day) {
      <!--
        The cell's accessible name is the WHOLE date, because the number in it is not one:
        a grid a user has arrowed into another month with says `27` and nothing about which
        27 it is. `aria-selected` is the chosen day and `aria-current="date"` is today —
        two different facts, and a control that drew them the same way would be saying the
        second one twice.

        The STATE attribute beside them is `data-pct-chosen` and not `data-pct-selected`,
        which is the name the select uses for the same idea. The reason is a measurement
        rather than a preference: `pct-selected` CONTAINS `pct-select`, which is the
        select's own selector and the marker `check-bundle` reads an entrypoint's presence
        by — so a calendar in any bundle made that bundle look as though it carried the
        select as well.
      -->
      <td
        class="pct-calendar__day"
        data-pct-part="day"
        [attr.data-pct-outside]="cell.inMonth ? null : ''"
        [attr.data-pct-chosen]="cell.selected ? '' : null"
        [attr.data-pct-today]="cell.today ? '' : null"
        [attr.data-pct-disabled]="cell.disabled ? '' : null"
        [attr.tabindex]="isCursor(cell.day) ? 0 : -1"
        [attr.aria-label]="cell.name"
        [attr.aria-selected]="cell.selected ? 'true' : null"
        [attr.aria-current]="cell.today ? 'date' : null"
        [attr.aria-disabled]="cell.disabled ? 'true' : null"
        (click)="pick(cell, $event)"
      >
        {{ cell.label }}
      </td>
      }
    </tr>
    }
  </tbody>
</table>
