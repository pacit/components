<ng-template #drawing>
  @if (drawn(); as drawn) {
  <svg:g
    data-pct-part="span"
    [attr.data-pct-series]="seriesAttr()"
    [style.--_pct-chart-color]="custom()"
  >
    <svg:rect
      class="band"
      [attr.x]="drawn.rect.x"
      [attr.y]="drawn.rect.y"
      [attr.width]="drawn.rect.width"
      [attr.height]="drawn.rect.height"
    />
    @if (label()) {
    <svg:text
      class="label"
      text-anchor="start"
      dominant-baseline="hanging"
      [attr.x]="drawn.label.x"
      [attr.y]="drawn.label.y"
      [textContent]="label()"
    ></svg:text>
    }
  </svg:g>
  }
</ng-template>

<!-- The band drawn small for the legend: a filled block in its colour. -->
<ng-template #swatch let-series>
  <svg
    class="swatch"
    data-pct-part="swatch"
    aria-hidden="true"
    viewBox="0 0 24 12"
    [attr.data-pct-series]="seriesAttr()"
    [style.--_pct-chart-color]="series.color"
  >
    <svg:rect class="band" x="1" y="2" width="22" height="8" />
  </svg>
</ng-template>
