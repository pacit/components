<!--
  Five buttons, each drawn by a role of the library's icons (0011): a font the application
  registers swaps every one. The bar is one stop: the arrows move between them.
-->
<button
  pctButton
  variant="outline"
  size="sm"
  iconOnly
  type="button"
  data-pct-part="zoom"
  [attr.tabindex]="active() === 0 ? 0 : -1"
  [attr.aria-label]="names()[0]"
  (click)="press(0)"
>
  <pct-icon name="zoom-in">
    <svg
      viewBox="0 0 16 16"
      width="100%"
      height="100%"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M11 11l3.5 3.5" />
      <circle cx="7" cy="7" r="4.5" />
      <path d="M7 5v4M5 7h4" />
    </svg>
  </pct-icon>
</button>
