<pct-table-frame>
  <table pctTable>
    <caption pctCaption>
      {{ captionText() }}
    </caption>
    <thead>
      <tr>
        <th pctHeader scope="col">
          {{ chart().x() === 'time' ? texts().chartTime : '' }}
        </th>
        @for (s of series(); track s.id) {
        <th pctHeader scope="col" numeric>
          {{ s.name }}@if (s.unit && s.unit !== 'boolean') { ({{ s.unit }})}
        </th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of table(); track row.x) {
      <tr>
        <th pctHeader scope="row">{{ row.label }}</th>
        @for (text of row.texts; track $index) {
        <td pctCell numeric>{{ text }}</td>
        }
      </tr>
      }
    </tbody>
  </table>
</pct-table-frame>
