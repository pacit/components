@if (measured() && !loading() && range(); as range) {
<!--
  The cursor's range (0103): the chart's one stop, beside the picture and never inside it —
  nor inside the figure, whose entry a reader announces in place of the range (NVDA, 2026-10-30).
  It runs from 0 to the window's span and its value is the cursor's distance from the window's
  start: a reader that works out a percentage from the numbers gets one of the window, where
  instants since 1970 overflowed it (Orca, 2026-10-30). The value is written after the ends, in
  the scene's render effect, so the browser's clamping never decides where the cursor is; the
  reading under it is its value text.
-->
<input
  #rangeInput
  class="range"
  type="range"
  step="any"
  dir="ltr"
  data-pct-part="range"
  [attr.min]="range.min"
  [attr.max]="range.max"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-labelledby]="ariaLabelledby() || null"
  [attr.aria-valuetext]="valueText()"
  [attr.aria-describedby]="ids.keys"
  (keydown)="onKey($event)"
  (input)="onInput($event)"
/>
}
<figure class="figure">
  <div
    class="picture"
    data-pct-part="plot"
    role="img"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledby() || null"
    [attr.aria-describedby]="fullDescription() ? ids.description : null"
  >
    @if (measured() && !loading()) {
    <svg class="layer" aria-hidden="true" data-pct-part="data">
      <defs>
        <!-- The clip holds the plot and the lanes beside it. -->
        <clipPath [id]="ids.clip">
          <rect
            [attr.x]="picture().left"
            [attr.y]="picture().top"
            [attr.width]="picture().right - picture().left"
            [attr.height]="picture().bottom - picture().top"
          />
        </clipPath>
      </defs>
      <g data-pct-part="grid">
        @for (s of gridLines().rows; track $index) {
        <line
          class="row"
          [attr.x1]="s.x1"
          [attr.x2]="s.x2"
          [attr.y1]="s.y1"
          [attr.y2]="s.y2"
        />
        } @for (s of gridLines().columns; track $index) {
        <line
          class="column"
          [attr.x1]="s.x1"
          [attr.x2]="s.x2"
          [attr.y1]="s.y1"
          [attr.y2]="s.y2"
        />
        }
      </g>
      <!-- Three layers of marks: under the series (a band), the series, over them (a line, a note). -->
      <g [attr.clip-path]="'url(#' + ids.clip + ')'">
        @let stamped = layers(); @for (mark of stamped.back; track mark) {
        <ng-container [ngTemplateOutlet]="mark.template()" />
        } @for (mark of stamped.data; track mark) {
        <ng-container [ngTemplateOutlet]="mark.template()" />
        } @for (mark of stamped.front; track mark) {
        <ng-container [ngTemplateOutlet]="mark.template()" />
        }
      </g>
    </svg>
    <svg class="layer" aria-hidden="true" data-pct-part="axis">
      @let xAxis = xAxisView();
      <line
        class="base"
        [attr.x1]="xAxis.base.x1"
        [attr.x2]="xAxis.base.x2"
        [attr.y1]="xAxis.base.y1"
        [attr.y2]="xAxis.base.y2"
      />
      @for (mark of xAxis.marks; track $index) {
      <line
        class="tick"
        [attr.x1]="mark.x1"
        [attr.x2]="mark.x2"
        [attr.y1]="mark.y1"
        [attr.y2]="mark.y2"
      />
      } @for (label of xAxis.labels; track $index) {
      <text
        class="time"
        [attr.text-anchor]="label.anchor"
        [attr.dominant-baseline]="label.baseline"
        [attr.x]="label.x"
        [attr.y]="label.y"
        [attr.data-pct-label]="label.label"
        [textContent]="label.text"
      ></text>
      } @if (xAxis.unitLabel; as unitLabel) {
      <text
        data-pct-part="unit"
        [attr.dominant-baseline]="unitLabel.baseline"
        [attr.text-anchor]="unitLabel.anchor"
        [attr.x]="unitLabel.x"
        [attr.y]="unitLabel.y"
        [textContent]="xUnit()"
      ></text>
      } @for (axis of axisViews(); track axis.unit) {
      <g [attr.data-pct-slot]="axis.slot" [attr.data-pct-unit]="axis.unit">
        <line
          class="base"
          [attr.x1]="axis.base.x1"
          [attr.x2]="axis.base.x2"
          [attr.y1]="axis.base.y1"
          [attr.y2]="axis.base.y2"
        />
        @for (label of axis.labels; track $index) {
        <text
          class="value"
          [attr.dominant-baseline]="label.baseline"
          [attr.text-anchor]="label.anchor"
          [attr.x]="label.x"
          [attr.y]="label.y"
          [textContent]="label.text"
        ></text>
        } @if (axis.unitLabel; as unitLabel) {
        <text
          data-pct-part="unit"
          [attr.dominant-baseline]="unitLabel.baseline"
          [attr.text-anchor]="unitLabel.anchor"
          [attr.x]="unitLabel.x"
          [attr.y]="unitLabel.y"
          [textContent]="axis.unit"
        ></text>
        } @for (dot of axis.dots; track $index) {
        <circle
          class="dot"
          r="3"
          [attr.data-pct-series]="dot.place"
          [attr.cx]="dot.cx"
          [attr.cy]="dot.cy"
        />
        }
      </g>
      }
    </svg>
    <!-- The cursor's layer: HTML, so the tooltip wraps and writes with the page's type. -->
    <div
      class="layer overlay"
      aria-hidden="true"
      (pointermove)="onPointerMove($event)"
      (pointerleave)="onPointerLeave($event)"
      (pointerdown)="onPointerDown($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerCancel($event)"
      (wheel)="onWheel($event)"
      [class.still]="zoom() === 'none'"
    >
      @if (selectionView(); as selection) {
      <div
        class="selection"
        data-pct-part="selection"
        [style.transform]="
          'translate(' + selection.x + 'px, ' + selection.y + 'px)'
        "
        [style.inline-size.px]="selection.width"
        [style.block-size.px]="selection.height"
      ></div>
      } @if (cursorView(); as view) {
      <div
        class="line"
        data-pct-part="cursor"
        [class.across]="horizontal()"
        [style.transform]="
          'translate(' + view.line.x + 'px, ' + view.line.y + 'px)'
        "
        [style.inline-size.px]="horizontal() ? view.line.width : null"
        [style.block-size.px]="horizontal() ? null : view.line.height"
      ></div>
      @for (marker of view.markers; track marker.id) {
      <div
        class="marker"
        data-pct-part="marker"
        [style.transform]="'translate(' + marker.x + 'px, ' + marker.y + 'px)'"
      >
        <ng-container
          [ngTemplateOutlet]="swatchOf(marker.id)"
          [ngTemplateOutletContext]="{ $implicit: marker, form: 'marker' }"
        />
      </div>
      } @if (tooltip() === 'auto' && reading(); as reading) {
      <div
        #tooltipBox
        class="tooltip"
        data-pct-part="tooltip"
        [class.unmeasured]="!view.tooltip.measured"
        [style.transform]="
          'translate(' + view.tooltip.x + 'px, ' + view.tooltip.y + 'px)'
        "
      >
        @if (customTooltip(); as template) {
        <ng-container
          [ngTemplateOutlet]="template"
          [ngTemplateOutletContext]="{ $implicit: reading }"
        />
        } @else {
        <div class="time" [textContent]="reading.text"></div>
        @for (row of reading.rows; track $index) {
        <div class="row">
          <ng-container
            [ngTemplateOutlet]="swatchOf(row.id)"
            [ngTemplateOutletContext]="{ $implicit: row, form: 'marker' }"
          />
          <span class="name" [textContent]="row.name"></span>
          <span class="value" [textContent]="row.text"></span>
        </div>
        } @for (note of reading.notes; track note.id) {
        <div class="row note">
          @if (note.swatch; as swatch) {
          <ng-container
            [ngTemplateOutlet]="swatch.template"
            [ngTemplateOutletContext]="{
              $implicit: swatch.identity,
              form: 'marker',
            }"
          />
          }
          <span class="name" [textContent]="note.name"></span>
          <span class="value" [textContent]="note.text"></span>
        </div>
        } }
      </div>
      } }
    </div>
    } @else {
    <pct-skeleton shape="block" class="skeleton" />
    }
  </div>
  @if (measured() && !loading() && nothing(); as nothing) {
  <p class="empty" data-pct-part="message">
    @if (nothing === 'hidden') { {{ texts().chartAllHidden }} } @else {
    <ng-content select="[pctChartEmpty]">{{ texts().chartEmpty }}</ng-content>
    }
  </p>
  } @if (fullDescription()) {
  <!-- Hidden: the picture reads it as its description, and nothing else reads it twice. -->
  <p
    class="description"
    hidden
    [id]="ids.description"
    [textContent]="fullDescription()"
  ></p>
  } @if (range()) {
  <!-- The keys of the cursor, which its range reads as its description. -->
  <p hidden [id]="ids.keys">{{ texts().chartKeys }}</p>
  }
  <ng-content select="figcaption" />
</figure>
@if (zoom() === 'x' && zoomButtons() && measured() && !loading()) {
<!-- The zoom bar over the plot's top corner: after the figure, so it stands over the cursor's layer. -->
<div class="layer zoom-place">
  <pct-chart-zoom
    [chart]="self"
    [style.transform]="
      'translate(calc(' + plot().right + 'px - 100% - 4px), ' + (plot().top + 4) + 'px)'
    "
  />
</div>
}
<!-- The marks' own elements, which draw nothing where they stand: their drawings are stamped into the layers above. -->
<ng-content />
