<ng-template #drawing>
  @if (!hidden()) { @if (area()) {
  <svg:path
    data-pct-part="area"
    [attr.d]="fill()"
    [attr.data-pct-series]="place()"
    [style.--_pct-chart-color]="custom()"
  />
  } @if (segments().length > 0) {
  <!-- The thresholds: the path once per colour, each clipped to its band of values. -->
  <svg:defs>
    @for (segment of segments(); track segment.id) {
    <svg:clipPath [attr.id]="segment.id">
      <svg:rect
        [attr.x]="segment.rect.x"
        [attr.y]="segment.rect.y"
        [attr.width]="segment.rect.width"
        [attr.height]="segment.rect.height"
      />
    </svg:clipPath>
    }
  </svg:defs>
  @for (segment of segments(); track segment.id) {
  <svg:path
    data-pct-part="series"
    class="segment"
    [class.dashed]="dashed()"
    [attr.d]="line()"
    [attr.data-pct-series]="segment.place"
    [attr.clip-path]="'url(#' + segment.id + ')'"
    [style.--_pct-chart-color]="segment.custom"
  />
  } } @else {
  <svg:path
    data-pct-part="series"
    [class.dashed]="dashed()"
    [attr.d]="line()"
    [attr.data-pct-series]="place()"
    [style.--_pct-chart-color]="custom()"
  />
  } }
</ng-template>

<!--
  The series drawn small, where its name stands (0102): its line with its dash and its marker
  for a legend, the marker alone for the cursor's line and the tooltip. The marker's ring is the
  surface's colour under the shape, so it stands out on the line it marks.
-->
<ng-template #swatch let-series let-form="form">
  <svg
    class="swatch"
    data-pct-part="swatch"
    aria-hidden="true"
    [class.marker]="form === 'marker'"
    [attr.viewBox]="form === 'marker' ? '0 0 12 12' : '0 0 24 12'"
    [attr.data-pct-series]="series.place"
    [style.--_pct-chart-color]="series.color"
  >
    @if (form === 'swatch') {
    <svg:line class="dash" x1="1" y1="6" x2="23" y2="6" />
    }
    <svg:path
      class="shape"
      [attr.d]="markerOf(series.place)"
      [attr.transform]="form === 'marker' ? null : 'translate(6 0)'"
    />
  </svg>
</ng-template>
