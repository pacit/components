<!--
  What a table of movable rows draws, in the places the table keeps for it: the header of the
  column of handles, and a row's handle. Drawn by the table, declared here, so a table whose
  rows stay put carries none of it (0097).
-->
<ng-template #head>
  <span class="pct-data-table__word" [id]="wordId"
    >{{ texts().tableMoveRow }}</span
  >
</ng-template>

<ng-template #cell let-row let-enabled="enabled">
  <button
    type="button"
    class="pct-data-table__handle"
    data-pct-part="handle"
    [attr.data-pct-row]="row.id"
    [disabled]="!enabled || order.disabled()"
    [attr.aria-labelledby]="wordId + ' ' + row.nameId"
    [attr.aria-keyshortcuts]="texts().tableMoveRowKeys"
    (keydown)="key(row.id, $event)"
    (pointerdown)="grab(row.id, $event)"
    (pointermove)="over($event)"
    (pointerup)="drop($event)"
    (pointercancel)="letGo()"
  >
    <pct-icon name="more" class="pct-data-table__grip">
      <svg
        viewBox="0 0 16 16"
        width="100%"
        height="100%"
        fill="currentColor"
        focusable="false"
      >
        <circle cx="6" cy="3.5" r="1.3" />
        <circle cx="10" cy="3.5" r="1.3" />
        <circle cx="6" cy="8" r="1.3" />
        <circle cx="10" cy="8" r="1.3" />
        <circle cx="6" cy="12.5" r="1.3" />
        <circle cx="10" cy="12.5" r="1.3" />
      </svg>
    </pct-icon>
  </button>
</ng-template>
