<!--
  The panel, declared once and drawn in the two places it can stand: inside the veil on an
  overlay, or in the host when `inline`. Two of its bindings differ between them, and both are
  the layer's business — `aria-modal` and `pctOverlayPanel` (`lesson-35`). The trap is created
  in the component and not bound here, because the ORDER it runs in is the promise (`detach`),
  and `tabindex="-1"` is the panel's own answer when nothing in it can take focus. Every WHY
  above is on the `inline` input and on `detach`: prose written here ships in the package
  (`lesson-67`).
-->
<ng-template #body>
  <div
    class="pct-dialog__panel"
    data-pct-part="panel"
    role="dialog"
    [attr.aria-modal]="inline() ? null : 'true'"
    [id]="panelId"
    [pctOverlayPanel]="inline() ? null : inherited()"
    tabindex="-1"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledby() || (heading() ? headingId : null)"
  >
    @if (heading() || closeButton()) {
    <div class="pct-dialog__header" data-pct-part="header">
      @if (heading()) {
      <h2 class="pct-dialog__heading" data-pct-part="heading" [id]="headingId">
        {{ heading() }}
      </h2>
      } @if (closeButton()) {
      <button
        type="button"
        class="pct-dialog__close"
        data-pct-part="close"
        [attr.aria-label]="texts().dialogClose"
        (click)="closeFromButton()"
      >
        <pct-icon name="close">
          <svg
            viewBox="0 0 16 16"
            width="100%"
            height="100%"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            focusable="false"
          >
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </pct-icon>
      </button>
      }
    </div>
    }

    <div class="pct-dialog__content" data-pct-part="content">
      <ng-content />
    </div>
  </div>
</ng-template>

<!-- The inline panel. `open` is the whole condition: no render is waited for, which is what
  puts this branch in the markup the server sends (`req-project-ssr`). -->
@if (inline() && open()) {
<ng-container [ngTemplateOutlet]="body" />
}

<ng-template #panel>
  <!--
    The veil. A `click` with no key handler beside it is the shape the a11y rule warns about,
    and here the key is Escape on the dialog itself — the surface is a shortcut for a gesture
    the keyboard already has, not the only way out.

    It wraps the panel rather than standing beside it, which is why `inline` is a branch here
    and not a hoist — the reason is on the input.
  -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div
    class="pct-dialog__backdrop"
    data-pct-part="backdrop"
    (pointerdown)="pressBackdrop($event)"
    (click)="clickBackdrop($event)"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </div>
</ng-template>
