<!--
  The drawing from data, element by element. The `@switch` IS the list of tags the renderer
  knows: a tag outside it has no case and draws nothing, which is how a `<script>` or a
  `<foreignObject>` in somebody's icon data ends. The attributes go through `pctSvgAttributes`,
  which paints geometry and nothing else — so no `on*`, no `href`, no `style` reaches an
  element, however the data spells it (0083). A sprite is one `<use>`, its address a path
  or `http(s):` and nothing that names another scheme.
-->
<svg
  width="100%"
  height="100%"
  focusable="false"
  [attr.viewBox]="viewBox()"
  [pctSvgAttributes]="attributes()"
>
  @for (node of nodes(); track $index) { @switch (node[0]) { @case ('path') {
  <svg:path [pctSvgAttributes]="node[1]" />
  } @case ('circle') {
  <svg:circle [pctSvgAttributes]="node[1]" />
  } @case ('ellipse') {
  <svg:ellipse [pctSvgAttributes]="node[1]" />
  } @case ('rect') {
  <svg:rect [pctSvgAttributes]="node[1]" />
  } @case ('line') {
  <svg:line [pctSvgAttributes]="node[1]" />
  } @case ('polyline') {
  <svg:polyline [pctSvgAttributes]="node[1]" />
  } @case ('polygon') {
  <svg:polygon [pctSvgAttributes]="node[1]" />
  } } } @if (address(); as href) {
  <svg:use [attr.href]="href" />
  }
</svg>
