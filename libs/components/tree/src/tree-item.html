<!--
  The row, then the group. The two-slot projection does the sorting: nested
  `pct-tree-item` elements land in the group, everything else is the label. The arrow's
  box is reserved on every row and drawn only on branches, so one level's labels align
  whether or not they fold; the drawing is the library's chevron turned by state and by
  writing direction in the stylesheet (0011, 0028 — the breadcrumb's quarter-turns).

  The group is in the DOM even when this item is a leaf, because a projection slot must
  not stand inside a branch of the template — and it is `hidden="until-found"` when
  folded (or a leaf), the tabs' answer (0045): find-in-page still searches a folded
  branch, and `beforematch` opens it, so the match is landed in rather than watched
  vanishing.
-->
<div class="pct-tree__label" data-pct-part="label">
  <span class="pct-tree__arrow" data-pct-part="arrow" aria-hidden="true">
    @if (branch()) {
    <pct-icon name="chevron-down">
      <svg
        viewBox="0 0 16 16"
        width="100%"
        height="100%"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        focusable="false"
      >
        <path d="M4 6l4 4 4-4" />
      </svg>
    </pct-icon>
    }
  </span>
  <ng-content />
</div>
<div
  class="pct-tree__group"
  role="group"
  [attr.hidden]="branch() && expanded() ? null : 'until-found'"
  (beforematch)="expanded.set(true)"
>
  <ng-content select="pct-tree-item" />
</div>
