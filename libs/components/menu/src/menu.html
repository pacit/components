<!--
  Over a layer, everything below is attached to a CDK overlay and lives outside the host tree —
  the host element renders nothing. The panel therefore carries `pctOverlayPanel`: what the tree
  stops handing it — theme, typeface, size, writing direction (`lesson-35`). Inline that binding
  holds `null`, because nothing was severed and nothing is to be handed back.

  It is a panel of the kind that DOES take focus, which is the other declaration 0025 named.
  Unlike the popover it does not keep it: focus goes on to an ITEM, because in this pattern the
  item is where the user stands. `tabindex="-1"` is the answer for the one menu that has no
  item to hand focus to — an empty one still has to be somewhere for Escape to be pressed.

  The items are the consumer's, projected here as they were written. They are direct content of
  `role="menu"` on purpose: a wrapper drawn between the two would break the parent/child
  relation the role rests on, and axe says so (`aria-required-children`).
-->
<ng-template #panel>
  <div
    class="pct-menu__panel"
    data-pct-part="panel"
    role="menu"
    [id]="panelId"
    [pctOverlayPanel]="inherited()"
    tabindex="-1"
    [attr.data-pct-leaving]="leaving() ? '' : null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledby() || (ariaLabel() ? null : triggerId())"
    (keydown)="onKeydown($event)"
    (focusin)="onFocusIn($event)"
  >
    <ng-content />
  </div>
</ng-template>

<!--
  Inline, that same template is rendered HERE, in the host, where the consumer wrote the
  component — never a second panel: one set of classes, one set of parts, one sheet, and no
  second place for either to be changed in. `open` still says whether it is shown, so a closed
  inline menu is markup nobody sends; an open one is markup the SERVER sends, which is the
  property the mode exists for.
-->
@if (inline() && open()) {
<ng-container [ngTemplateOutlet]="panel" />
}
