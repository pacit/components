<div class="pct-checkbox__row">
  <span class="pct-checkbox__box" data-pct-part="box">
    <input
      #control
      class="pct-checkbox__control"
      data-pct-part="control"
      type="checkbox"
      [id]="controlId"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="disabled()"
      [attr.name]="name() || null"
      [attr.required]="required() || null"
      [attr.aria-label]="ariaLabel() || null"
      [attr.aria-labelledby]="ariaLabelledby() || null"
      [attr.aria-invalid]="showInvalid() ? 'true' : null"
      [attr.aria-readonly]="readonly() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (click)="onClick($event)"
      (change)="onChange($event)"
      (blur)="onBlur()"
    />

    <!-- The mark drawn as SVG in currentColor — no dependency on an icon set, and the
         name is what lets a consumer put their own drawing here (`req-api-icons`). The
         state is one thing said twice on purpose: the name is what a set is asked for,
         the path is what this component draws when no set answers. -->
    <pct-icon
      class="pct-checkbox__mark"
      data-pct-part="mark"
      [name]="indeterminate() ? 'indeterminate' : 'check'"
    >
      <svg
        viewBox="0 0 16 16"
        width="100%"
        height="100%"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        focusable="false"
      >
        @if (indeterminate()) {
        <path d="M4 8h8" />
        } @else {
        <path d="M3.5 8.5l3 3 6-6.5" />
        }
      </svg>
    </pct-icon>
  </span>

  @if (label() && !inField) {
  <label
    class="pct-checkbox__label"
    data-pct-part="label"
    [attr.for]="controlId"
  >
    {{ label() }} @if (required()) {
    <span class="pct-checkbox__required" aria-hidden="true">*</span>
    }
  </label>
  }
</div>

<!-- One message line, and the error takes it (`req-api-message`). -->
@if (showError()) {
<span
  class="pct-checkbox__error"
  data-pct-part="error"
  [id]="errorId"
  role="alert"
>
  {{ errorText() }}
</span>
} @else if (showWarning()) {
<!-- A verdict without a veto (0087): the same third branch the chrome draws — the tone's glyph
     before the text, a hidden word for a reader, `status` where the error is `alert` (0026). -->
<span
  class="pct-checkbox__warning"
  data-pct-part="warning"
  [id]="warningId"
  role="status"
>
  <pct-icon class="pct-checkbox__warning-icon" name="warning">
    <svg
      viewBox="0 0 16 16"
      width="100%"
      height="100%"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      focusable="false"
    >
      <path d="M8 2.6L14.5 13.4h-13z" />
      <path d="M8 6.6v2.6" />
      <path d="M8 11.4h.01" />
    </svg>
  </pct-icon>
  <span class="pct-checkbox__sr">{{ texts().fieldWarning }}</span>
  {{ warningText() }}
</span>
} @else if (hint() && !inField) {
<span class="pct-checkbox__hint" data-pct-part="hint" [id]="hintId">
  {{ hint() }}
</span>
}
