<!-- One element per message, and the region around them is the HOST — a place that was there
     before anything had to be said (0044). `role="alert"` on an urgent one is the other half
     of the same measurement: the engines publish it as `live=assertive` with `atomic=true`
     for that message alone, while the log around it stays polite and non-atomic. -->
@for (toast of toasts(); track toast.id) {
<div
  class="pct-toast__item"
  data-pct-part="item"
  [attr.role]="toast.urgent ? 'alert' : null"
  [attr.data-pct-urgent]="toast.urgent ? '' : null"
  [attr.data-pct-tone]="toast.tone"
>
  <!--
    The tone, and the half of it that is not a colour. Four branches with a LITERAL name in
    each rather than one `[name]="toast.tone"`: `check-icons` reads the names a template draws
    out of its text, so an expression that spells none of them leaves four public names undrawn
    (point 5) and the icon itself unnamed (point 3). The drawing is the element's content, so a
    consumer's own set replaces it (0011); the part sits ON the `pct-icon` and not under it,
    because the styling contract is the box, which survives that swap, and not the path, which
    does not (point 6).
  -->
  @switch (toast.tone) { @case ('success') {
  <pct-icon class="pct-toast__icon" data-pct-part="icon" name="success">
    <svg
      viewBox="0 0 16 16"
      width="100%"
      height="100%"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      focusable="false"
    >
      <circle cx="8" cy="8" r="6" />
      <path d="M5.4 8.3l1.8 1.8 3.4-3.9" />
    </svg>
  </pct-icon>
  } @case ('warning') {
  <pct-icon class="pct-toast__icon" data-pct-part="icon" name="warning">
    <svg
      viewBox="0 0 16 16"
      width="100%"
      height="100%"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      focusable="false"
    >
      <path d="M8 2.6L14.5 13.4h-13z" />
      <path d="M8 6.6v2.6" />
      <path d="M8 11.4h.01" />
    </svg>
  </pct-icon>
  } @case ('danger') {
  <pct-icon class="pct-toast__icon" data-pct-part="icon" name="danger">
    <svg
      viewBox="0 0 16 16"
      width="100%"
      height="100%"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      focusable="false"
    >
      <circle cx="8" cy="8" r="6" />
      <path d="M8 4.8v3.4" />
      <path d="M8 11h.01" />
    </svg>
  </pct-icon>
  } @case ('info') {
  <pct-icon class="pct-toast__icon" data-pct-part="icon" name="info">
    <svg
      viewBox="0 0 16 16"
      width="100%"
      height="100%"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      focusable="false"
    >
      <circle cx="8" cy="8" r="6" />
      <path d="M8 7.4v3.4" />
      <path d="M8 4.8h.01" />
    </svg>
  </pct-icon>
  } }

  <span class="pct-toast__message" data-pct-part="message"
    >{{ toast.text }}</span
  >

  @if (toast.actionLabel) {
  <button
    type="button"
    class="pct-toast__action"
    data-pct-part="action"
    (click)="run(toast)"
  >
    {{ toast.actionLabel }}
  </button>
  }

  <!-- The one control every message has. A toast that can be taken down by hand is what
       makes the clock an accelerator rather than the only way out of it, and it is the same
       cross the dialog draws (0028). -->
  <button
    type="button"
    class="pct-toast__close"
    data-pct-part="close"
    [attr.aria-label]="texts().toastDismiss"
    (click)="dismiss(toast)"
  >
    <pct-icon name="close">
      <svg
        viewBox="0 0 16 16"
        width="100%"
        height="100%"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        focusable="false"
      >
        <path d="M4 4l8 8M12 4l-8 8" />
      </svg>
    </pct-icon>
  </button>
</div>
}
